name: Resultados Torneio CGSS RALI 2026

# Publica os resultados do "Torneio CGSS RALI 2026" (Santo da Serra, ccode 007,
# tcode REAL fixo 11050) assim que a FPG os publicar. Vai directo às
# classificações (SEM TournamentsLST) e tenta os dois hosts gémeos
# (scoring.datagolf.pt e scoring.fpg.pt) até um devolver resultados. Substitui a
# entrada só-draw (tcode placeholder 90071) pelos resultados reais.
#
# Corre:
#  - Automaticamente a 1 de Agosto (15:00/17:00/19:00 UTC = 16:00/18:00/20:00
#    Lisboa) — apanha os resultados assim que forem publicados nesse dia. O
#    script sai com exit 2 (sem commit) enquanto não houver classificação, por
#    isso as corridas "cedo demais" são inofensivas.
#  - A pedido (botão "Run workflow"), opcionalmente com o tcode real.
#
# ⚠ Torneio ÚNICO: depois de 1 Ago 2026 estar publicado, este workflow pode ser
#   removido. Em anos futuros a cron dispara na mesma mas sai sempre exit 2 (o
#   script está fixo à data 2026-08-01), por isso não faz mal deixá-lo.
#
# Requer os GitHub Secrets DATAGOLF_SCORING_COOKIES (scoring.datagolf.pt, o mesmo
# do update-classif) e FPG_ADMISSIONS_COOKIES (scoring.fpg.pt, o mesmo do
# update-fpg-admissions-draws). Basta um deles autenticar para haver resultados.
on:
  workflow_dispatch:
    inputs:
      tcode:
        description: 'tcode do RALI 2026 (opcional; vazio = usa o tcode fixo conhecido 11050).'
        required: false
        default: ''
  schedule:
    - cron: '0 15,17,19 1 8 *'   # 1 Ago, 16:00/18:00/20:00 Lisboa

permissions:
  contents: write

jobs:
  update-rali:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr update-rali-2026-results.js
        id: scrape
        run: |
          set +e
          ARGS=""
          if [ -n "${{ github.event.inputs.tcode }}" ]; then
            ARGS="--tcode ${{ github.event.inputs.tcode }}"
          fi
          echo "Args: $ARGS"
          node scripts/update-rali-2026-results.js $ARGS
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Updater falhou"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Ainda sem resultados publicados — sem commit."
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}
          FPG_ADMISSIONS_COOKIES: ${{ secrets.FPG_ADMISSIONS_COOKIES }}

      - name: Commit e push (se houve resultados)
        if: steps.scrape.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/pull-torneios001.json public/data/cgss-draws-manual.json public/data/fpg-admissions-draws.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          git commit -m "data: resultados Torneio CGSS RALI 2026 (Santo da Serra)"

          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || { git rebase --abort 2>/dev/null || true; sleep $((i * 5)); continue; }
            if git push; then PUSH_OK=1; break; fi
            echo "Push tentativa $i falhou — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ Commit feito"
