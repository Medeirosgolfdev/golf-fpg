name: USKids Member History
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  historico:
    name: 📋 Histórico de Jogadores
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node scripts/fetch-uskids-member-history.js
      - run: node scripts/build-member-history-slim.js
      - name: Commit se houve alterações
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/uskids-member-history-slim.json public/data-archive/uskids-member-history*.json
          git diff --cached --quiet && exit 0
          git fetch origin main
          git merge origin/main --no-edit --strategy-option=ours
          git add public/data/uskids-member-history-slim.json public/data-archive/uskids-member-history*.json
          git commit -m "data: histórico USKids [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
