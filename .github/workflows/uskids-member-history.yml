name: USKids Member History
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
# Uma corrida de cada vez entre os dois workflows que escrevem o histórico
# USKids (uskids-member-history + uskids-refresh-all). A 19/10/2026 o refresh-all
# manual (13:48-17:14) e o agendado (que o GitHub atrasou das 09:00 para as
# 15:58) correram sobrepostos e o segundo falhou o push com conflito nos chunks
# e no slim. Com o grupo, o segundo espera e faz checkout já com o push do outro.
concurrency:
  group: uskids-member-history
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  historico:
    name: 📋 Histórico de Jogadores
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node scripts/fetch-uskids-member-history.js
      # O fetch já escreve directamente chunks uskids-member-history-NNN.json
      # (≤ 85 MB) — não há monolítico (o JSON.stringify do objecto inteiro
      # passava o limite de string do V8 e rebentava). O split corre em modo
      # --from-chunks: consolida os chunks do fetch e re-equilibra para ≤ 70 MB,
      # ~30 % abaixo do hard-limit de 100 MB do GitHub. Os chunks alimentam o
      # build-slim e ficam em git como cache para o próximo run do fetch.
      - run: node scripts/split-member-history.js --from-chunks --target-mb=70
      - run: node scripts/build-member-history-slim.js
      - name: Commit se houve alterações
        # Glob entre aspas: é o git a fazer o matching, por isso as deletions de
        # chunks antigos (003-046, etc.) entram também. -o: os ficheiros deste run
        # ganham (era o merge -X ours de antes); a fila uskids-member-history impede
        # os dois workflows de correrem ao mesmo tempo.
        run: |
          bash scripts/ci/push-generated.sh -m "data: histórico USKids [$(date -u '+%Y-%m-%d %H:%M UTC')]" \
            -o 'data-archive/uskids-member-history-*.json' -o public/data/uskids-member-history-slim.json \
            -- 'data-archive/uskids-member-history-*.json' public/data/uskids-member-history-slim.json
