name: Cookie health — validar cookies FPG antes do fim-de-semana

# Valida os 3 conjuntos de cookies (secrets) ANTES da janela de scrapes de
# Sex/Sáb/Dom. Se algum estiver expirado, o workflow falha → email do GitHub
# com tempo para refrescar (Chrome 90 → DevTools → actualizar secrets).
#
# Playbook de refresh: CLAUDE.md "Cenário 1: Os cookies expiraram".
#
# Corre:
#   - Quinta-feira 09:00 UTC (≈09/10h Lisboa) — margem de 1 dia útil
#   - A pedido (Run workflow)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 4'   # Quinta 09:00 UTC

permissions:
  contents: read

jobs:
  cookie-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cada teste corre mesmo que o anterior falhe — queremos saber TODOS
      # os cookies mortos de uma vez, não só o primeiro.
      - name: "my.fpg.pt (FPG_COOKIES — WHS/scorecards, update-data)"
        id: fpg
        continue-on-error: true
        env:
          FPG_COOKIES: ${{ secrets.FPG_COOKIES }}
        run: |
          set +e
          node scripts/test-fpg-auth.js
          echo "code=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: "scoring.datagolf.pt (DATAGOLF_SCORING_COOKIES — drive/classif/jovens)"
        id: datagolf
        continue-on-error: true
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}
        run: |
          set +e
          node scripts/test-datagolf-node.js
          echo "code=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: "scoring.fpg.pt/lists (FPG_ADMISSIONS_COOKIES — admissions/draws)"
        id: admissions
        continue-on-error: true
        env:
          FPG_ADMISSIONS_COOKIES: ${{ secrets.FPG_ADMISSIONS_COOKIES }}
        run: |
          set +e
          node scripts/test-fpg-admissions-auth.js
          echo "code=$?" >> $GITHUB_OUTPUT
          exit 0

      # ⚠ Testar contra "success", NUNCA contra "failure": um passo que não
      # chegou a correr tem outcome "skipped", e com o teste ao contrário o
      # resumo dava "✓ os 3 conjuntos estão válidos" sem ter validado nada
      # (visto a 2026-08-20 num run cancelado no checkout).
      #
      # ⚠ E separar as DUAS causas de falha (2026-08-30): exit 3 = a FPG está
      # em baixo (medido por uma sonda SEM credenciais — ver
      # scripts/lib/fpg-liveness.js). Nesse dia o vigia mandou refrescar dois
      # secrets que tinham 7 horas e estavam bons: os mesmos cookies davam 500,
      # e um entry gate sem credencial nenhuma dava 500 também. Pedir trabalho
      # inútil é a forma mais rápida de o alarme deixar de ser lido.
      - name: Resumo
        if: always()
        run: |
          COOKIES=""   # secrets realmente mortos → há trabalho para fazer
          FONTE=""     # FPG em baixo → não é connosco, voltar mais tarde
          INDEF=""     # teste não chegou a correr

          classificar () {   # $1=nome  $2=outcome  $3=exit code
            case "$2:$3" in
              success:*) return ;;
              *:3)  FONTE="$FONTE $1" ;;
              *:2)  COOKIES="$COOKIES $1" ;;
              *)    INDEF="$INDEF $1:$2/exit${3:-?}" ;;
            esac
          }
          classificar "FPG_COOKIES(my.fpg.pt)"                  "${{ steps.fpg.outcome }}"        "${{ steps.fpg.outputs.code }}"
          classificar "DATAGOLF_SCORING_COOKIES(scoring.datagolf.pt)" "${{ steps.datagolf.outcome }}"   "${{ steps.datagolf.outputs.code }}"
          classificar "FPG_ADMISSIONS_COOKIES(scoring.fpg.pt)"  "${{ steps.admissions.outcome }}" "${{ steps.admissions.outputs.code }}"

          if [ -n "$FONTE" ]; then
            echo "⚠ FONTE EM BAIXO (não é dos nossos cookies):$FONTE"
            echo "  Uma sonda SEM credenciais falhou igual — refrescar cookies NÃO resolve."
            echo "  Enquanto a FPG estiver assim, a validade destes cookies é indeterminável."
            echo ""
          fi
          if [ -n "$COOKIES" ]; then
            echo "❌ Cookies expirados/inválidos:$COOKIES"
            echo ""
            echo "Refrescar antes de Sexta à noite (janela de scrapes):"
            echo "  1. Chrome 90 → login/navegar nos sites afectados"
            echo "  2. F12 → Application → Cookies → copiar"
            echo "  3. Actualizar os GitHub Secrets correspondentes"
            echo "  (Playbook completo: CLAUDE.md — 'Cenário 1: cookies expiraram')"
          fi
          if [ -n "$INDEF" ]; then
            echo "⚠ Testes que não deram veredicto:$INDEF"
          fi

          # Só falha o job quando há trabalho NOSSO para fazer. Uma avaria da
          # FPG fica registada no resumo mas não pinta o cron de vermelho —
          # senão o alarme toca por coisas que não podemos resolver.
          if [ -n "$COOKIES" ] || [ -n "$INDEF" ]; then exit 1; fi
          if [ -n "$FONTE" ]; then
            echo "Sem acção da nossa parte — voltar a validar quando a FPG recuperar."
            exit 0
          fi
          echo "✓ Os 3 conjuntos de cookies estão válidos"
