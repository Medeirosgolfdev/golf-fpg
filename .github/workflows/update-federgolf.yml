name: Actualizar Federgolf (Itália) — provas juvenis

# Provas juvenis da Federazione Italiana Golf (federgolf.it, API pública sem
# login) para a /fig. Ver scripts/scrape-federgolf.js e docs/claude/italia.md.
#
# Âmbito (Mariana, 02/11/2026): todas as provas de 2022 em diante; de 2018 a
# 2021 só as que têm portugueses inscritos (`--so-pt-antes 2022`). Antes de
# 2018 a Federgolf não tem classificação na API (só PDF).
# 1) Passagem rápida (só totais): só as provas que ainda não estão gravadas
#    (~20 s cada), por isso as novas aparecem logo.
# 2) Cartões buraco a buraco, do mais recente para trás, até 2,5 h por corrida:
#    o servidor deles demora ~20 s por pedido, por isso os cartões vão-se
#    completando corrida a corrida (uma prova com todos os cartões e jogada há
#    mais de 10 dias não se volta a pedir).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-federgolf:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # Provas por jogar: a lista de inscritos (rápido, ~2 s por prova).
      - name: Provas futuras (inscritos)
        run: node scripts/scrape-federgolf.js --futuras || [ $? -eq 2 ]

      # Ranking juvenil nacional (idade, lugar, média) e as voltas de cada jogador.
      - name: Ranking juvenil
        run: node scripts/scrape-federgolf-ranking.js || [ $? -eq 2 ]

      # Só as que faltam (as gravadas saltam-se).
      - name: Provas novas (só totais, até 2 h)
        run: |
          ANOS=$(seq -s, "$(date -u +%Y)" -1 2018)
          node scripts/scrape-federgolf.js --sem-cartoes --so-pt-antes 2022 --max-min 120 --anos "$ANOS" || [ $? -eq 2 ]

      - name: Cartões (até 2,5 h)
        run: |
          ANOS=$(seq -s, "$(date -u +%Y)" -1 2018)
          node scripts/scrape-federgolf.js --so-pt-antes 2022 --max-min 150 --anos "$ANOS" || [ $? -eq 2 ]

      - name: Commit e push (se houver mudanças)
        run: |
          bash scripts/ci/push-generated.sh -m "data: Federgolf $(date -u +'%Y-%m-%d %H:%M UTC')" \
            -o 'public/data/federgolf' -o public/data/federgolf-index.json \
            -o public/data/federgolf-ranking.json -o public/data/federgolf-ranking-voltas.json \
            -- public/data/federgolf public/data/federgolf-index.json \
               public/data/federgolf-ranking.json public/data/federgolf-ranking-voltas.json
