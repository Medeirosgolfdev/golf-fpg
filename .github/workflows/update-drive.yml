name: Actualizar Dados DRIVE

# Corre:
#  - Automaticamente Sex/Sáb/Dom às 21:00 UTC (~22:00 Lisboa)
#  - A pedido (botão "Run workflow" no GitHub)
#
# Cron desfasado dos workflows update-jovens (21:20) e update-data (21:40)
# para evitar non-fast-forward no git push.
#
# Por DEFAULT só descarrega torneios do mês corrente + mês anterior (rápido).
# Para histórico completo, usar workflow_dispatch com months_back=99.
#
# Requer GitHub Secrets:
#   DATAGOLF_SCORING_COOKIES — cookie header capturado de scoring.datagolf.pt
#                              formato: "ASP.NET_SessionId=XXX; DG_Lists_URL=YYY"
#   FPG_ADMISSIONS_COOKIES   — cookies scoring.fpg.pt/lists (rankings oficiais
#                              Drive via RankingsClassifLST + verificação)
on:
  workflow_dispatch:
    inputs:
      months_back:
        description: 'Quantos meses anteriores incluir (0=só mês corrente, 1=default, 99=ano inteiro)'
        required: false
        default: '1'
      force_commit:
        description: 'Fazer commit mesmo se os totais não aumentarem?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # Minuto Hora Dia Mês DiaSemana (UTC)
    # 21:00 UTC à Sexta (5), Sábado (6) e Domingo (0)
    - cron: '0 21 * * 5,6,0'

permissions:
  contents: write

jobs:
  update-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-drive-node.js (Node puro, sem Playwright)
        id: scrape
        run: |
          set +e
          MONTHS_BACK="${{ github.event.inputs.months_back || '1' }}"
          node scripts/scrape-drive-node.js --months-back $MONTHS_BACK
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = há mais dados → commit
          # 2 = nada novo → não commit (NÃO é erro)
          # 3 = a FONTE (FPG) está em baixo → não é erro NOSSO, não falhar o cron
          # 1 = erro real
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper falhou — ver logs acima"
            exit 1
          fi
          if [ "$EXIT_CODE" = "3" ]; then
            # ⚠ 2026-08-30: a FPG teve uma avaria de ~9h (09:27→18:10 UTC) e
            # este job ficou vermelho como se os cookies (7 horas de vida)
            # tivessem expirado. Exit 3 = a FPG nem responde na rota pública,
            # único caso em que ficar verde é honesto; o run seguinte apanha o
            # torneio na mesma, porque o --months-back cobre o mês inteiro.
            echo "⚠ Fonte FPG em baixo — nada a fazer do nosso lado; o próximo run recupera"
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Nenhum dado novo — a saltar o commit"
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      # Só o ano corrente: são os únicos ficheiros que o scrape toca
      # (--months-back 1). Os históricos não mudam — validá-los todos os runs
      # eram ~60 ficheiros lidos à toa. Para validar tudo: workflow_dispatch
      # com months_back=99 (aí o scrape reescreve o histórico e convém).
      - name: Validar dados scrapados
        if: steps.scrape.outputs.exit_code == '0' || github.event.inputs.force_commit == 'true'
        run: |
          if [ "${{ github.event.inputs.months_back }}" = "99" ]; then
            YEARS="*"
          else
            # ano corrente + anterior (em Janeiro o --months-back 1 cai em Dezembro)
            YEARS="$(date +'%Y') $(( $(date +'%Y') - 1 ))"
          fi
          ARGS=""
          for Y in $YEARS; do
            ARGS="$ARGS --glob public/data/drive-data-${Y}-*.json"
            ARGS="$ARGS --glob public/data/aquapor-data-${Y}-*.json"
          done
          node scripts/validate-data.js $ARGS

      # ── Rankings OFICIAIS (RankingsClassifLST) + verificação contra os nossos ──
      # Só 1×/semana (run de Domingo) ou a pedido: os rankings mudam devagar e
      # estes dois passos dominavam o tempo do workflow. O --details é
      # incremental (só refaz o detalhe de quem mudou de pontos).
      - name: É dia de rankings?
        id: rkday
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "run=yes" >> $GITHUB_OUTPUT
          else
            echo "run=no" >> $GITHUB_OUTPUT
            echo "ℹ️  Rankings Drive só correm ao Domingo (ou em run manual) — a saltar"
          fi

      - name: Scrape rankings oficiais Drive (com detalhe por torneio)
        id: rankings
        if: steps.rkday.outputs.run == 'yes'
        run: |
          set +e
          node scripts/scrape-drive-rankings.js --details
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" = "1" ]; then
            echo "⚠ scrape de rankings falhou (cookies?) — continua sem actualizar rankings"
          fi
          exit 0
        env:
          FPG_ADMISSIONS_COOKIES: ${{ secrets.FPG_ADMISSIONS_COOKIES }}

      - name: Verificar rankings calculados vs oficiais
        if: steps.rkday.outputs.run == 'yes'
        run: |
          set +e
          node scripts/verify-drive-rankings.js
          EXIT_CODE=$?
          if [ "$EXIT_CODE" = "1" ]; then
            echo "⚠⚠ DIVERGÊNCIAS entre rankings calculados e oficiais — ver relatório acima e public/data/drive-rankings-check.json"
          elif [ "$EXIT_CODE" = "0" ]; then
            echo "✓ Rankings calculados = oficiais"
          fi
          exit 0

      - name: Commit e push (se houver novos dados)
        if: steps.scrape.outputs.exit_code == '0' || (steps.rankings.outcome == 'success' && steps.rankings.outputs.exit_code == '0') || github.event.inputs.force_commit == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/drive-data-*.json public/data/aquapor-data-*.json
          git add public/data/drive-rankings.json public/data/drive-rankings-check.json 2>/dev/null || true

          # Dupla verificação: só commitar se o git diff realmente mostra alterações
          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          CHANGED=$(git diff --staged --name-only | wc -l)
          git commit -m "data: update DRIVE/AQUAPOR ${DATE} (${CHANGED} ficheiros)"
          # Push robusto: retry com pull --rebase em cada tentativa.
          # Em runs manuais (sem o cron offset) podemos colidir com outro
          # workflow a fazer push em paralelo → non-fast-forward.
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push; then
              PUSH_OK=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ Commit feito — ${CHANGED} ficheiros actualizados"
