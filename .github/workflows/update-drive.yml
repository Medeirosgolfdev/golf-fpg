name: Actualizar Dados DRIVE

# Corre:
#  - Automaticamente Sex/Sáb/Dom às 21:00 UTC (~22:00 Lisboa)
#  - A pedido (botão "Run workflow" no GitHub)
#
# Cron desfasado dos workflows update-jovens (21:20) e update-data (21:40)
# para evitar non-fast-forward no git push.
#
# Por DEFAULT só descarrega torneios do mês corrente + mês anterior (rápido).
# Para histórico completo, usar workflow_dispatch com months_back=99.
#
# Requer GitHub Secret:
#   DATAGOLF_SCORING_COOKIES — cookie header capturado de scoring.datagolf.pt
#                              formato: "ASP.NET_SessionId=XXX; DG_Lists_URL=YYY"
on:
  workflow_dispatch:
    inputs:
      months_back:
        description: 'Quantos meses anteriores incluir (0=só mês corrente, 1=default, 99=ano inteiro)'
        required: false
        default: '1'
      force_commit:
        description: 'Fazer commit mesmo se os totais não aumentarem?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # Minuto Hora Dia Mês DiaSemana (UTC)
    # 21:00 UTC à Sexta (5), Sábado (6) e Domingo (0)
    - cron: '0 21 * * 5,6,0'

permissions:
  contents: write

jobs:
  update-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-drive-node.js (Node puro, sem Playwright)
        id: scrape
        run: |
          set +e
          MONTHS_BACK="${{ github.event.inputs.months_back || '1' }}"
          node scripts/scrape-drive-node.js --months-back $MONTHS_BACK
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = há mais dados → commit
          # 2 = nada novo → não commit (NÃO é erro)
          # 1 = erro real
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper falhou — ver logs acima"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Nenhum dado novo — a saltar o commit"
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      - name: Commit e push (se houver novos dados)
        if: steps.scrape.outputs.exit_code == '0' || github.event.inputs.force_commit == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/drive-data-*.json public/data/aquapor-data-*.json

          # Dupla verificação: só commitar se o git diff realmente mostra alterações
          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          CHANGED=$(git diff --staged --name-only | wc -l)
          git commit -m "data: update DRIVE/AQUAPOR ${DATE} (${CHANGED} ficheiros)"
          # Rebase em cima de qualquer commit que tenha entrado entretanto
          # (evita non-fast-forward quando vários workflows correm em paralelo)
          git pull --rebase origin ${GITHUB_REF_NAME} || git rebase --abort
          git push
          echo "✓ Commit feito — ${CHANGED} ficheiros actualizados"
