name: USKids Field Monitor
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
# Uma corrida de cada vez deste workflow: a seguinte espera (não cancela a
# que está a correr). Entre workflows diferentes quem resolve é o
# scripts/ci/push-generated.sh — ver docs/claude/workflows.md, «Push dos dados».
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: ⛳ Descoberta + Inscritos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # Exit 2 = a guarda anti-encolhimento recusou gravar (rate limit do
      # signupanytime, fonte degradada). Não é erro: o ficheiro bom que já
      # estava em disco fica intacto e não há nada de novo para commitar.
      - name: Descoberta + inscritos
        id: field
        run: |
          set +e
          node scripts/fetch-uskids-field.js
          CODE=$?
          if [ "$CODE" = "2" ]; then
            echo "::warning::USKids: build recusado pela guarda anti-encolhimento — dados anteriores preservados."
            echo "degradado=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          exit $CODE
      - name: Commit se houve alterações
        if: steps.field.outputs.degradado != '1'
        # -o: os ficheiros deste run ganham (era o merge -X ours de antes).
        run: |
          bash scripts/ci/push-generated.sh -m "data: USKids field [$(date -u '+%Y-%m-%d %H:%M UTC')]" \
            -o public/data/uskids-field.json -o public/data/uskids-discovery-cache.json \
            -o public/data/uskids-pid-anchors.json -o public/data/uskids-tcode-catalog.json \
            -- public/data/uskids-field.json public/data/uskids-discovery-cache.json \
               public/data/uskids-pid-anchors.json public/data/uskids-tcode-catalog.json
      # Canário: a avaria de 2026 passou 7 semanas despercebida porque o
      # workflow ficava VERDE a descobrir zero torneios. Falhar aqui faz o
      # GitHub mandar email. Limiares largos de propósito — isto avisa que a
      # varredura parou, não que houve uma semana fraca. A decisão vive em
      # scripts/lib/uskids-rate-guard.js (avaliarCanario), com testes.
      - name: Canário — a descoberta continua viva?
        if: steps.field.outputs.degradado != '1'
        run: node scripts/uskids-canary.js
