name: USKids Field Monitor
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    name: ⛳ Descoberta + Inscritos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # Exit 2 = a guarda anti-encolhimento recusou gravar (rate limit do
      # signupanytime, fonte degradada). Não é erro: o ficheiro bom que já
      # estava em disco fica intacto e não há nada de novo para commitar.
      - name: Descoberta + inscritos
        id: field
        run: |
          set +e
          node scripts/fetch-uskids-field.js
          CODE=$?
          if [ "$CODE" = "2" ]; then
            echo "::warning::USKids: build recusado pela guarda anti-encolhimento — dados anteriores preservados."
            echo "degradado=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          exit $CODE
      - name: Commit se houve alterações
        if: steps.field.outputs.degradado != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/uskids-field.json public/data/uskids-discovery-cache.json public/data/uskids-pid-anchors.json
          git diff --cached --quiet && exit 0
          git fetch origin main
          git merge origin/main --no-edit --strategy-option=ours
          git add public/data/uskids-field.json public/data/uskids-discovery-cache.json public/data/uskids-pid-anchors.json
          git commit -m "data: USKids field [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Push robusto: retry com pull --rebase em cada tentativa.
          # Em runs manuais (sem o cron offset) podemos colidir com outro
          # workflow a fazer push em paralelo → non-fast-forward.
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push; then
              PUSH_OK=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
      # Canário: a avaria de 2026 passou 7 semanas despercebida porque o
      # workflow ficava VERDE a descobrir zero torneios. Falhar aqui faz o
      # GitHub mandar email. Limiares largos de propósito — isto avisa que a
      # varredura parou, não que houve uma semana fraca.
      - name: Canário — a descoberta continua viva?
        if: steps.field.outputs.degradado != '1'
        run: |
          node -e '
            const c = require("./public/data/uskids-discovery-cache.json");
            const d = c.dias_sem_descoberta, a = c.dias_sem_avanco;
            console.log(`sem torneios novos: ${d}d | sem a fronteira avançar: ${a}d | último tcode vivo: ${c.varredura_max_t}`);
            console.log(`varredura: ${JSON.stringify(c.varredura || {})}`);
            const erros = [];
            if (d != null && d > 30) erros.push(`${d} dias sem descobrir um torneio novo`);
            if (a != null && a > 21) erros.push(`${a} dias sem a fronteira de tcodes avançar`);
            if (c.varredura && c.varredura.fim === "rate-limit") {
              // Auto-recuperável: a varredura densa do dia seguinte apanha o
              // que faltou. Falhar aqui tocaria o alarme por algo que se
              // resolve sozinho — e um alarme que toca sempre deixa de ser
              // lido. Se persistir, os limiares de 21d/30d acima disparam.
              console.log("::warning::USKids: o signupanytime aplicou rate limit — varredura truncada nesta corrida.");
            }
            else if (c.varredura && c.varredura.fim === "rede-degradada")
              erros.push("a fronteira foi abandonada por falta de resposta do servidor");
            else if (c.varredura && c.varredura.intervalos_degradados >= 2)
              erros.push(`${c.varredura.intervalos_degradados} intervalos sem resposta (rede degradada)`);
            if (!erros.length) { console.log("OK"); process.exit(0); }
            console.log(`::error::USKids: a varredura pode estar parada — ${erros.join("; ")}. Ver a secção da varredura de tcodes no CLAUDE.md.`);
            process.exit(1);
          '
