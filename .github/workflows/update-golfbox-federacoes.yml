name: Actualizar federações no GolfBox (Suíça, Bélgica)

# Provas juvenis das federações que publicam tudo no GolfBox: Swiss Golf
# (customer 1085) e Royal Belgian Golf Federation (customer 22).
# scripts/scrape-golfbox-federacao.js --fed {swissgolf|rbgf} lê o calendário da
# época corrente e da anterior e grava public/data/{fed}/{competitionId}.json;
# se algum mudou, regenera o kids2.
#
# API PÚBLICA → SEM secrets/cookies.
#
# Corre:
#  - Uma vez por semana, segunda às 06:30 UTC, de Abril a Novembro — as provas
#    juvenis são ao fim-de-semana e as épocas vão de Abril a Outubro (a de
#    Novembro apanha o último fim-de-semana de Outubro). Mariana, 04/11/2026:
#    «1x por semana chega».
#  - A pedido, com números de competição GolfBox ad-hoc ou outras épocas.
#
# Nota: o commit é self-contained (scrape + agregador) porque um push feito com
# GITHUB_TOKEN não dispara o build-juniors.yml (regra anti-recursão do GitHub).
on:
  workflow_dispatch:
    inputs:
      fed:
        description: 'federação (swissgolf ou rbgf; vazio = todas)'
        required: false
        default: ''
        type: string
      ids:
        description: 'competitionId(s) GolfBox separados por vírgula (vazio = calendário; exige fed)'
        required: false
        default: ''
        type: string
      anos:
        description: 'épocas separadas por vírgula (vazio = a corrente e a anterior)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '30 6 * 4-11 1'

permissions:
  contents: write

jobs:
  update-golfbox-federacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: update-golfbox-federacoes
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-golfbox-federacao.js
        id: scrape
        run: |
          set +e
          FED="${{ github.event.inputs.fed }}"
          IDS="${{ github.event.inputs.ids }}"
          ANOS="${{ github.event.inputs.anos }}"
          FEDS="${FED:-swissgolf rbgf}"
          GRAVOU=0; ERRO=0
          for F in $FEDS; do
            if [ -n "$IDS" ]; then
              node scripts/scrape-golfbox-federacao.js --fed "$F" --ids "$IDS"
            elif [ -n "$ANOS" ]; then
              node scripts/scrape-golfbox-federacao.js --fed "$F" --anos "$ANOS"
            else
              node scripts/scrape-golfbox-federacao.js --fed "$F"
            fi
            RC=$?
            # 0 = houve novidades · 2 = sem alterações (NÃO é erro) · 1 = erro real
            [ "$RC" = "0" ] && GRAVOU=1
            [ "$RC" = "1" ] && ERRO=1
          done
          if [ "$GRAVOU" = "1" ]; then EXIT_CODE=0; elif [ "$ERRO" = "1" ]; then EXIT_CODE=1; else EXIT_CODE=2; fi
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$ERRO" = "1" ]; then
            echo "❌ Uma das federações falhou — ver logs acima"
          fi
          if [ "$EXIT_CODE" = "1" ]; then exit 1; fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem alterações — a saltar regeneração e commit"
          fi
          exit 0

      - name: Regenerar juniores canónicos (agregador)
        if: steps.scrape.outputs.exit_code == '0'
        run: node scripts/aggregator/index.js

      - name: Commit e push (se houve alterações)
        if: steps.scrape.outputs.exit_code == '0'
        # -f agregador: juniors*.json & c.ª regenerados (nunca fundidos) se o main avançar.
        run: |
          bash scripts/ci/push-generated.sh -m "data: federações GolfBox (Suíça, Bélgica) + rebuild juniors $(date +'%Y-%m-%d %H:%M')" \
            -f agregador -- public/data
