name: Actualizar WAGR

# Refresh do World Amateur Golf Ranking (wagr.com) — Node-puro, SEM secrets:
# a API é pública (worldgolfranking2021api.wagr.com) e os leaderboards vêm no
# __NEXT_DATA__ do SSR das páginas de evento. Pipeline:
#   1. scrape-wagr.js --ranking                 → wagr-ranking.json (M+F, ~8.400)
#   2. scrape-wagr.js --events --skip-existing  → wagr/events/wagr_{id}.json (novos)
#   3. build-wagr-events-list.js                → wagr/wagr-events-list.json (índice sidebar)
#
# ⚠ São ~4.000 eventos por ano no mundo inteiro. Com --skip-existing um run
#   semanal só apanha os novos (dezenas), mas o PRIMEIRO run de um ano novo
#   demora — daí o timeout largo. O ranking é sempre re-scrapado (muda todas as
#   semanas, à quarta-feira).
# ⚠ NÃO alimenta o agregador kids2: o WAGR não tem DOB nem escalão do jogador,
#   o matching seria fraco. É uma página autónoma (ver CLAUDE.md).
on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Re-fetch de TODOS os eventos (ignora --skip-existing)'
        required: false
        default: false
        type: boolean
      extra_year:
        description: 'Ano adicional a scrapar (backfill, ex: 2024)'
        required: false
        type: string
  schedule:
    # Quarta 07:00 UTC — o ranking WAGR sai à quarta-feira.
    - cron: '0 7 * * 3'

permissions:
  contents: write

jobs:
  update-wagr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: update-wagr
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Scrape WAGR (ranking + eventos + índice)
        run: |
          set +e
          SKIP="--skip-existing"
          if [ "${{ github.event.inputs.full_rebuild }}" = "true" ]; then SKIP=""; fi

          YEAR=$(date -u +'%Y')
          PREV=$((YEAR - 1))
          YEARS="--year $YEAR --year $PREV"
          if [ -n "${{ github.event.inputs.extra_year }}" ]; then
            YEARS="$YEARS --year ${{ github.event.inputs.extra_year }}"
          fi

          echo "▸ ranking";       node scripts/scrape-wagr.js --ranking
          echo "▸ eventos $YEARS"; node scripts/scrape-wagr.js --events $YEARS $SKIP --concurrency 8
          echo "▸ índice";        node scripts/build-wagr-events-list.js
          # Nenhum destes é fatal (exit 2 = sem novidades). Erros reais nos logs.
          exit 0

      - name: Detectar alterações WAGR
        id: diff
        run: |
          if git diff --quiet -- public/data/wagr public/data/wagr-ranking.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Sem alterações WAGR — a saltar commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit e push (se houve alterações)
        if: steps.diff.outputs.changed == 'true'
        run: |
          bash scripts/ci/push-generated.sh -m "data: WAGR refresh $(date +'%Y-%m-%d %H:%M')" \
            -- public/data/wagr public/data/wagr-ranking.json
