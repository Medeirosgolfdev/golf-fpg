name: USKids Rich Players
on:
  schedule:
    # Segunda-feira às 02:00 UTC (corre depois do uskids-member-history,
    # que normalmente termina nas primeiras horas da manhã)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      players:
        description: 'memberIDs específicos (CSV). Vazio = todos os do slim.'
        required: false
        default: ''
      since_days:
        description: 'Skip players com ficheiro mais recente que N dias (default 14)'
        required: false
        default: '14'
      concurrency:
        description: 'Workers paralelos para GetMemberTournamentResults (default 4)'
        required: false
        default: '4'
      force_rebuild:
        description: 'Ignorar caches e re-fetch tudo (lento)'
        type: boolean
        required: false
        default: false
      limit:
        description: 'Máx N players (smoke test). Vazio = sem limite.'
        required: false
        default: ''
      max_runtime_min:
        description: 'Prazo de execução em minutos (o script pára e grava progresso antes do limite de 6h). 0 = sem limite.'
        required: false
        default: '300'

permissions:
  contents: write

jobs:
  rich-players:
    name: 📊 Rich Players (pivot por jogador)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Build args
        id: args
        run: |
          ARGS="--since-days ${{ github.event.inputs.since_days || '14' }}"
          ARGS="$ARGS --concurrency ${{ github.event.inputs.concurrency || '4' }}"
          ARGS="$ARGS --max-runtime-min ${{ github.event.inputs.max_runtime_min || '300' }}"
          if [ -n "${{ github.event.inputs.players }}" ]; then
            ARGS="$ARGS --players ${{ github.event.inputs.players }}"
          fi
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            ARGS="$ARGS --force-rebuild"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          echo "ARGS=$ARGS" >> $GITHUB_OUTPUT
          echo "Vou correr com: $ARGS"

      - name: Run scrape
        id: scrape
        run: |
          set +e
          node scripts/fetch-uskids-rich-players-node.js ${{ steps.args.outputs.ARGS }}
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Erro fatal"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "📍 Sem novidades — skip commit"
          fi
          exit 0

      - name: Commit se houve alterações
        # Corre em exit 0 (progresso) E exit 2 (sem novos players): mesmo sem
        # ficheiros novos, a cache aquecida da Fase 2 pode ter avançado e deve
        # ser committada. O guard `git diff --cached --quiet` no-opa se nada mudou.
        if: steps.scrape.outputs.exit_code != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # DOIS commits+pushes separados: as fichas dos jogadores primeiro, a
          # cache depois. Antes era um commit só — a 17 e 24 Ago 2026 o push foi
          # rejeitado (a cache passou os 100 MB do GitHub) e levou atrás as
          # fichas do run: 10h de scrape deitadas fora. Separados, um problema
          # na cache já não custa os dados novos.
          commit_push () {
            msg="$1"; shift
            # Um `git add` POR path: com vários de uma vez, um pathspec que não
            # existe (o run-summary num run vazio, o .json legado já migrado)
            # aborta o add INTEIRO e o commit no-opava em silêncio.
            # Glob entre aspas — sem aspas, o bash expande antes do git ver e
            # silenciosamente perde deletions (ver uskids-member-history.yml).
            for pathspec in "$@"; do
              git add -A "$pathspec" 2>/dev/null || true
            done
            if git diff --cached --quiet; then
              echo "· nada a committar em: $*"
              return 0
            fi
            git commit -m "$msg"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push tentativa $i falhou — retry em $((i * 5))s"
              sleep $((i * 5))
            done
            echo "❌ Push falhou após 5 tentativas: $msg"
            return 1
          }

          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          FAILED=0

          commit_push "data: USKids rich players [$STAMP]" \
            'data-archive/uskids-rich-players/' \
            data-archive/uskids-rich-run-summary.json || FAILED=1

          # A cache é gzipada (~8 MB). O path .json legado vai na mesma lista
          # para o commit registar a sua remoção na migração.
          commit_push "data: USKids rich flight cache [$STAMP]" \
            data-archive/uskids-rich-flight-cache.json.gz \
            data-archive/uskids-rich-flight-cache.json || FAILED=1

          exit $FAILED
