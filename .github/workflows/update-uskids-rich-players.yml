name: USKids Rich Players
on:
  schedule:
    # Segunda-feira às 02:00 UTC (corre depois do uskids-member-history,
    # que normalmente termina nas primeiras horas da manhã)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      players:
        description: 'memberIDs específicos (CSV). Vazio = todos os do slim.'
        required: false
        default: ''
      since_days:
        description: 'Skip players com ficheiro mais recente que N dias (default 14)'
        required: false
        default: '14'
      force_rebuild:
        description: 'Ignorar caches e re-fetch tudo (lento)'
        type: boolean
        required: false
        default: false
      limit:
        description: 'Máx N players (smoke test). Vazio = sem limite.'
        required: false
        default: ''
      max_runtime_min:
        description: 'Prazo de execução em minutos (o script pára e grava progresso antes do limite de 6h). 0 = sem limite.'
        required: false
        default: '300'

# A mesma fila do update-uskids-edicoes: os dois escrevem a
# uskids-rich-flight-cache.json.gz — nunca ao mesmo tempo (20/10/2026).
concurrency:
  group: uskids-rich-flight-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rich-players:
    name: 📊 Rich Players (pivot por jogador)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Build args
        id: args
        run: |
          ARGS="--since-days ${{ github.event.inputs.since_days || '14' }}"
          # Sem --concurrency: a USKids só aceita um pedido de cada vez e o
          # script pára à primeira recusa (403/429/503/«Too many requests»).
          ARGS="$ARGS --max-runtime-min ${{ github.event.inputs.max_runtime_min || '300' }}"
          if [ -n "${{ github.event.inputs.players }}" ]; then
            ARGS="$ARGS --players ${{ github.event.inputs.players }}"
          fi
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            ARGS="$ARGS --force-rebuild"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          echo "ARGS=$ARGS" >> $GITHUB_OUTPUT
          echo "Vou correr com: $ARGS"

      - name: Run scrape
        id: scrape
        run: |
          set +e
          node scripts/fetch-uskids-rich-players-node.js ${{ steps.args.outputs.ARGS }}
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Erro fatal"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "📍 Sem novidades — skip commit"
          fi
          exit 0

      - name: Commit se houve alterações
        # Corre em exit 0 (progresso) E exit 2 (sem novos players): mesmo sem
        # ficheiros novos, a cache aquecida da Fase 2 pode ter avançado e deve
        # ser committada. O push-generated no-opa se nada mudou.
        if: steps.scrape.outputs.exit_code != '1'
        run: |
          # DOIS commits+pushes separados: as fichas dos jogadores primeiro, a
          # cache depois. Antes era um commit só — a 17 e 24 Ago 2026 o push foi
          # rejeitado (a cache passou os 100 MB do GitHub) e levou atrás as
          # fichas do run: 10h de scrape deitadas fora. Separados, um problema
          # na cache já não custa os dados novos.
          # ⚠ O 1.º push faz reset --hard ao main: a cache (fora dos pathspecs
          # dele) é guardada antes e reposta a seguir.
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          FAILED=0
          KEEP=$(mktemp -d)
          cp -p data-archive/uskids-rich-flight-cache.json.gz "$KEEP/" 2>/dev/null || true
          bash scripts/ci/push-generated.sh -m "data: USKids rich players [$STAMP]" \
            -- 'data-archive/uskids-rich-players/' data-archive/uskids-rich-run-summary.json || FAILED=1
          [ -f "$KEEP/uskids-rich-flight-cache.json.gz" ] && cp -p "$KEEP/uskids-rich-flight-cache.json.gz" data-archive/
          # A cache é gzipada (~36 MB). O path .json legado vai na lista para o
          # commit registar a sua remoção se ainda existir.
          bash scripts/ci/push-generated.sh -m "data: USKids rich flight cache [$STAMP]" \
            -o data-archive/uskids-rich-flight-cache.json.gz \
            -- data-archive/uskids-rich-flight-cache.json.gz data-archive/uskids-rich-flight-cache.json || FAILED=1
          exit $FAILED
