name: Atualizar Dados Golf FPG (cookies-based)

# Corre:
#  - Automaticamente Domingo e Segunda às 00:05 UTC — logo após o cut SD
#  - A pedido (botão "Run workflow" no GitHub)
#
# ⚠ TIMING IMPORTANTE: O Score Differential (SD) e o WHS Index são calculados
# pelo sistema FPG à meia-noite Lisboa (00:00 WET / 23:00 UTC no verão, 00:00
# UTC no inverno). 5 minutos depois são margem suficiente para o FPG processar.
#
#   - Dom 00:05 UTC = 00:05 Lisboa inverno / 01:05 Lisboa verão → apanha Sáb
#   - Seg 00:05 UTC = 00:05 Lisboa inverno / 01:05 Lisboa verão → apanha Dom
#
# Se algum scorecard vier sem SD (muito improvável com 5min de margem), o
# próximo incremental apanha — o scraper salta sempre scorecards já completos.
#
# Este é o único workflow FPG que depende do SD (scrapa WHS do my.fpg.pt).
# Os outros (drive, jovens, admissions-draws, classif) não têm esse constraint
# porque scrapam dados públicos dos torneios, não handicap index.
#
# Requer GitHub Secret:
#   FPG_COOKIES — cookie header completo capturado do Firefox/Chrome 90
#                 formato: "_ga=...; ASP.NET_SessionId=...; .AspNet.ApplicationCookie=...; ..."
#                 Refrescar ~1×/semana

on:
  workflow_dispatch:
    inputs:
      fed_codes:
        description: 'Fed codes separados por espaço (vazio = TODOS de players.json)'
        required: false
        default: ''
      full_rebuild:
        description: 'Re-descarregar TUDO (lento, só usar se suspeitar de dados corrompidos)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '5 0 * * 0,1'   # Dom e Seg às 00:05 UTC (5min depois do cut SD da meia-noite Lisboa inverno)

permissions:
  contents: write
  issues: write   # aviso imediato de scorecards novos (resumo por email)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determinar fed codes
        id: feds
        run: |
          if [ -n "${{ github.event.inputs.fed_codes }}" ]; then
            echo "mode=explicit" >> $GITHUB_OUTPUT
            echo "codes=${{ github.event.inputs.fed_codes }}" >> $GITHUB_OUTPUT
          else
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "codes=--all" >> $GITHUB_OUTPUT
          fi

      - name: Correr scraper FPG (Node puro, sem Playwright)
        id: scrape
        run: |
          set +e
          FULL_FLAG=""
          if [ "${{ github.event.inputs.full_rebuild || 'false' }}" = "true" ]; then
            FULL_FLAG="--full"
          fi
          node scripts/fpg-scrape-node.js ${{ steps.feds.outputs.codes }} $FULL_FLAG --concurrency 3
          EXIT=$?
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          if [ "$EXIT" = "1" ]; then exit 1; fi  # erro real
          exit 0
        env:
          FPG_COOKIES: ${{ secrets.FPG_COOKIES }}

      # PCC (Playing Conditions Calculation) — a FPG só o calcula ao FIM DO DIA,
      # depois de entrarem todos os cartões do campo. Os scrapes de resultados
      # correm na própria noite do torneio (update-classif, update-drive,
      # update-cgss-draw-results) e apanham o campo `cba` ainda vazio, deixando
      # o torneio para sempre sem PCC — e o SD das tabelas a divergir do oficial
      # exactamente por (113/slope)×PCC. Como ESTE workflow corre depois da
      # meia-noite de Lisboa e acaba de descarregar o WHS (que traz o `cba`
      # oficial de cada volta), é aqui que se apanha o que ficou para trás, sem
      # um único pedido extra à FPG. Exit 2 = nada a preencher (não é erro).
      - name: Preencher PCC em falta (do WHS acabado de descarregar)
        id: pcc
        run: |
          set +e
          node scripts/backfill-pcc.js --apply
          EXIT=$?
          set -e
          if [ "$EXIT" = "0" ]; then echo "filled=1" >> $GITHUB_OUTPUT; else echo "filled=0" >> $GITHUB_OUTPUT; fi
          if [ "$EXIT" = "1" ]; then echo "⚠  backfill-pcc falhou — segue sem preencher."; fi
          exit 0

      # Reconstruir os índices que dependem das rondas dos jogadores:
      #  - away-courses.json        (campos internacionais + _players)  ← extract-courses
      #  - course-player-names.json (nº federado → nome real)           ← build-course-player-names
      #  - course-players.json      (quem jogou cada campo PT do master)← build-course-players
      # Corre sempre (mesmo sem scorecards novos) porque players.json /
      # federados podem ter mudado. Falhas individuais não abortam o run.
      - name: Reconstruir índices de campos e jogadores
        run: |
          node scripts/extract-courses.js --force || echo "extract-courses: sem novidades ou aviso"
          node scripts/build-course-player-names.js || echo "build-course-player-names: aviso"
          node scripts/build-course-players.js || echo "build-course-players: aviso"
          # Torneios recentes reconstruídos das voltas dos nossos jogadores
          # (public/data/recent-tournaments.json → página /torneios-recentes)
          node scripts/build-recent-tournaments.js || echo "build-recent-tournaments: aviso"
          # Calendário dos jogadores de referência, só juniores
          # (public/data/classificacoes.json → /FPG/classificacoes)
          node scripts/build-classificacoes.js || echo "build-classificacoes: aviso"
          # Página estática /analise-percurso-juniores.html — regenera o bloco
          # de dados `const P` a partir de output/{fed}/whs.json (exit 2 = sem mudanças)
          node scripts/build-analise-percurso.js || echo "build-analise-percurso: sem novidades ou aviso"
          # Mesma página, bloco `const PATH` — percurso de torneios até scratch
          # dos 18 rapazes da coorte, com o detalhe por jogador que a tabela
          # mostra ao expandir uma linha (exit 2 = sem mudanças)
          node scripts/build-percurso-path.js || echo "build-percurso-path: sem novidades ou aviso"

      # Nota: o `fpg-scrape-node.js` já dispara `pipeline.js --skip-import <feds_com_novidades>`
      # automaticamente no fim quando há scorecards novos. Não é preciso passo extra aqui.
      # Para reprocessar TODOS os jogadores (caso muito raro): correr manualmente
      # `node pipeline.js --skip-import --all` localmente e committar.

      # ── Aviso imediato: scorecards novos dos nossos federados ──────────
      # Corre ANTES do commit de propósito: o resumo lê o diff da ÁRVORE DE
      # TRABALHO, que é exactamente o que este run produziu. Depois do commit
      # o `git pull --rebase` do push traria commits de outros workflows e o
      # diff deixaria de ser só nosso.
      # Nunca falha o workflow (os scripts engolem os próprios erros) — os
      # dados é que interessam, o email é extra.
      - name: Aviso imediato de scorecards novos (email)
        if: steps.scrape.outputs.exit_code == '0'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/build-run-digest.js \
            --source federados \
            --only-players \
            --out /tmp/digest-federados.json
          if [ -f /tmp/digest-federados.json ]; then
            node scripts/send-digest-issue.js \
              --file /tmp/digest-federados.json \
              --title "⛳ Scorecards novos — $(date -u +'%Y-%m-%d %H:%M') UTC"
          else
            echo "ℹ️  Sem scorecards novos — sem aviso."
          fi

      - name: Commit e push (se houve novidades)
        # Também committa quando NÃO houve scorecards novos mas o backfill-pcc
        # preencheu PCC em falta — senão o PCC ficava no runner e perdia-se.
        if: steps.scrape.outputs.exit_code == '0' || steps.pcc.outputs.filled == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Diagnóstico: listar ficheiros modificados antes do git add.
          # Útil para debug se "Nada em staging" voltar a acontecer.
          CHANGED_BEFORE=$(git status --porcelain 2>/dev/null | wc -l)
          echo "ℹ️  ${CHANGED_BEFORE} ficheiros modificados no working copy antes do git add"

          # Paths gerados pelo fluxo fpg-scrape-node.js + pipeline.js:
          #   - output/{fed}/*                → fpg-scrape-node.js + pipeline (render)
          #   - public/data/{fed}/analysis/   → só o Manuel (render estático)
          #   - public/data/players.json      → pipeline.js (sync step)
          #   - public/data/cross-data.json   → make-scorecards-ui.js (tabela
          #     global CROSS_DATA, 1 cópia partilhada por todas as fichas desde
          #     2026-09-06). SEM isto a tabela ficava no runner e o site servia
          #     escalões/índices congelados no dia da migração.
          #   - public/player-stats.json      → enrich-players.js  ⚠ SEM /data/
          #   - public/data/hcp-history.json  → enrich-players.js (evolução de HCP)
          #   - public/analise-percurso-juniores.html → build-analise-percurso.js
          #   - public/data/away-courses.json → extract-courses.js (disabled no pipeline normal)
          #   - public/data/master-courses.json → idem
          #   - players.json (raiz)           → pipeline.js (sync step)
          #
          # Bug histórico (2026-04-22): o path era "public/data/player-stats.json",
          # mas enrich-players.js escreve "public/player-stats.json" (sem /data/).
          # Resultado: o workflow detectava novos scorecards mas nunca commitava.
          git add output/ \
                  public/data/*/analysis/ \
                  public/data/players.json \
                  public/data/cross-data.json \
                  public/player-stats.json \
                  public/data/hcp-history.json \
                  public/analise-percurso-juniores.html \
                  public/data/away-courses.json \
                  public/data/master-courses.json \
                  public/data/course-player-names.json \
                  public/data/course-players.json \
                  public/data/recent-tournaments.json \
                  public/data/recent-tournaments-scrape-scope.json \
                  public/data/classificacoes.json \
                  public/data/pull-torneios*.json \
                  public/data/drive-data-*.json \
                  public/data/aquapor-data-*.json \
                  players.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "⚠  Nada em staging — sem commit."
            if [ "${CHANGED_BEFORE}" -gt 0 ]; then
              echo ""
              echo "❗ Mas havia ${CHANGED_BEFORE} ficheiros modificados. Lista (primeiros 50):"
              git status --porcelain 2>/dev/null | head -50
              echo ""
              echo "Paths fora do scope do git add. Adicionar à lista acima se for recorrente."
            fi
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          CHANGED=$(git diff --staged --name-only | wc -l)
          git commit -m "data: update FPG WHS+scorecards ${DATE} (${CHANGED} ficheiros)"
          # Rebase em cima de qualquer commit que tenha entrado entretanto.
          # --autostash lida com quaisquer ficheiros unstaged que tenham ficado
          # para trás do git add (stashes automaticamente e repõe após o pull).
          # Push robusto: retry com pull --rebase em cada tentativa.
          # Em runs manuais (sem o cron offset) podemos colidir com outro
          # workflow a fazer push em paralelo → non-fast-forward.
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push; then
              PUSH_OK=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ Commit feito — ${CHANGED} ficheiros actualizados"
