name: Atualizar Dados Golf FPG (cookies-based)

# Corre:
#  - Automaticamente Sábado e Domingo às 21:00 UTC (≈22:00 Lisboa)
#  - A pedido (botão "Run workflow" no GitHub)
#
# Requer GitHub Secret:
#   FPG_COOKIES — cookie header completo capturado do Firefox/Chrome 90
#                 formato: "_ga=...; ASP.NET_SessionId=...; .AspNet.ApplicationCookie=...; ..."
#                 Refrescar ~1×/semana

on:
  workflow_dispatch:
    inputs:
      fed_codes:
        description: 'Fed codes separados por espaço (vazio = TODOS de players.json)'
        required: false
        default: ''
      full_rebuild:
        description: 'Re-descarregar TUDO (lento, só usar se suspeitar de dados corrompidos)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '0 21 * * 6,0'   # Sáb e Dom às 21:00 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determinar fed codes
        id: feds
        run: |
          if [ -n "${{ github.event.inputs.fed_codes }}" ]; then
            echo "mode=explicit" >> $GITHUB_OUTPUT
            echo "codes=${{ github.event.inputs.fed_codes }}" >> $GITHUB_OUTPUT
          else
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "codes=--all" >> $GITHUB_OUTPUT
          fi

      - name: Correr scraper FPG (Node puro, sem Playwright)
        id: scrape
        run: |
          set +e
          FULL_FLAG=""
          if [ "${{ github.event.inputs.full_rebuild || 'false' }}" = "true" ]; then
            FULL_FLAG="--full"
          fi
          node scripts/fpg-scrape-node.js ${{ steps.feds.outputs.codes }} $FULL_FLAG --concurrency 3
          EXIT=$?
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          if [ "$EXIT" = "1" ]; then exit 1; fi  # erro real
          exit 0
        env:
          FPG_COOKIES: ${{ secrets.FPG_COOKIES }}

      - name: Regenerar data.json consolidados (pipeline)
        if: steps.scrape.outputs.exit_code == '0'
        run: |
          node pipeline.js --skip-import --all || echo "pipeline.js falhou — continuar"

      - name: Commit e push (se houve novidades)
        if: steps.scrape.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ public/data/*/analysis/ public/data/players.json players.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada em staging — sem commit."
            exit 0
          fi
          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: update WHS+scorecards ${DATE}"
          git push
          echo "✓ Commit feito"
