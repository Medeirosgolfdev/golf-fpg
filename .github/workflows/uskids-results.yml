name: USKids Results Monitor
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resultados:
    name: 🏆 Resultados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node scripts/fetch-uskids-results.js
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/uskids-results.json
          git diff --cached --quiet && exit 0
          git fetch origin main
          git merge origin/main --no-edit --strategy-option=ours
          git add public/data/uskids-results.json
          git commit -m "data: resultados USKids [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Push robusto: retry com pull --rebase em cada tentativa.
          # Em runs manuais (sem o cron offset) podemos colidir com outro
          # workflow a fazer push em paralelo → non-fast-forward.
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push; then
              PUSH_OK=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
