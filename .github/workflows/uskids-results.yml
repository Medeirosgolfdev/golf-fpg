name: USKids Results Monitor
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
# Uma corrida de cada vez deste workflow: a seguinte espera (não cancela a
# que está a correr). Entre workflows diferentes quem resolve é o
# scripts/ci/push-generated.sh — ver docs/claude/workflows.md, «Push dos dados».
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resultados:
    name: 🏆 Resultados
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      # Exit 2 = nada de novo (não é erro); 1 = erro. Os dois scripts param à
      # primeira recusa da USKids e gravam só os torneios completos.
      - name: Resultados
        run: node scripts/fetch-uskids-results.js || [ $? -eq 2 ]
      - name: Draws (Manuel + adjacentes ±1, ≤ 3d antes)
        run: node scripts/fetch-uskids-draws.js || [ $? -eq 2 ]
      - name: Validar dados scrapados
        run: node scripts/validate-data.js public/data/uskids-results.json

      - name: Commit
        run: |
          bash scripts/ci/push-generated.sh -m "data: resultados + draws USKids [$(date -u '+%Y-%m-%d %H:%M UTC')]" \
            -o public/data/uskids-results.json -o public/data/uskids-draws.json \
            -- public/data/uskids-results.json public/data/uskids-draws.json
