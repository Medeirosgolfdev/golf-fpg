name: Resultados de torneios draw-only (CGSS + PJA) → tcode real

# AUTO-DESCOBRIDOR (2026-08-28, 2ª geração; 3ª a 2026-09-02: deixou de ser só
# CGSS). O job varre os ficheiros de draws curados à procura de entradas
# PENDENTES — tcode placeholder 9xxxx, drawOnly:true, com data entre há 3 dias
# e hoje — e corre o update-cgss-draw-results.js para cada uma: descoberta do
# tcode real (TournamentsLST por clube+data + sondagem com prova de identidade
# por sobreposição de nomes do draw), scrape, substituição do placeholder,
# re-chaveamento do draw e reconciliação de fedCodes. Sem pendentes, o job sai
# logo (verde, barato).
#
#   public/data/cgss-draws-manual.json → ccode 007 (Santo da Serra)
#   public/data/pja-draws-manual.json  → PJA Tour (192 Comporta, 029 Aroeira…)
#
# Tudo o que é por-torneio é DERIVADO, não configurado: o ficheiro pull-torneios
# onde vive o stub, a janela de sondagem (à volta do maior tcode real do clube)
# e o nº de rondas a exigir (o `rounds` do stub). Uma prova a 2 voltas só é
# promovida quando as DUAS estão publicadas — promovê-la no fim do 1.º dia
# deixá-la-ia congelada com uma ronda, e sem placeholder o auto-descobridor
# nunca mais lhe pegava.
#
# Faz par com o percurso da pasta draws-inbox/ (local): largar o PDF do draw
# lá → scripts/process-draw-inbox.js insere a entrada draw-only e committa →
# este workflow apanha os resultados no fim-de-semana seguinte. Zero edições
# manuais. (A janela de 3 dias também deixa de fora, por construção, casos
# como o Calheta Viva 90072 — interrompido por tempestade, draw-only eterno.)
#
# Crons (UTC): Sex/Sáb/Dom de hora a hora 12:10-18:10 (13:10-19:10 Lisboa no
# verão — os CGSS acabam ~13h, os PJA ~16h30) + Seg-Qui 13:10 (uma passagem
# diária para torneios raros a meio da semana e catch-up).
#
# SEM SECRETS OBRIGATÓRIOS desde 2026-09-02: o scraper lê os resultados pelo
# canal PÚBLICO (o gateway linkpage.aspx emite sessão a quem chega sem
# credenciais — ver scripts/lib/fpg-session.js). As cookies, quando existem,
# ficam como fallback; é o que faz isto funcionar ao domingo à tarde, quando
# as cookies (~9h de vida) já morreram.
on:
  workflow_dispatch:
    inputs:
      placeholder:
        description: 'Forçar UM placeholder (9xxxx) — salta a janela de datas.'
        required: false
        default: ''
      search:
        description: 'Dica de nome p/ ordenação (dias com 2 torneios do clube).'
        required: false
        default: ''
      tcode:
        description: 'tcode REAL (opcional — salta a descoberta).'
        required: false
        default: ''
  schedule:
    - cron: '10 12-18 * * 5,6,0'   # Sex/Sáb/Dom, 13:10-19:10 Lisboa (verão)
    - cron: '10 13 * * 1-4'        # Seg-Qui, 14:10 Lisboa — catch-up diário

permissions:
  contents: write
  issues: write

jobs:
  update-cgss-draw:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Varrer pendentes (draw-only 9xxxx com data recente)
        id: pending
        run: |
          LIST=$(node -e '
            const fs = require("fs");
            const FICHEIROS = [
              { file: "public/data/cgss-draws-manual.json", adopt: 0 },
              // O PJA publica o nome a sério (o CGSS fica-se por "Torneio NNNNN",
              // e aí o nome do PDF do draw é que é bom) → adopta o oficial.
              { file: "public/data/pja-draws-manual.json", adopt: 1 },
            ];
            const forced = (process.env.INPUT_PLACEHOLDER || "").trim();
            const iso = (x) => x.toISOString().slice(0, 10);
            const today = iso(new Date());
            const cut = iso(new Date(Date.now() - 3 * 864e5));

            // Índice dos pull-torneios: onde vive o stub e qual o maior tcode
            // REAL de cada clube (base da janela de sondagem).
            const stub = new Map();      // "ccode/tcode" → { idx, rounds }
            const maxReal = new Map();   // ccode → maior tcode < 90000
            for (const f of fs.readdirSync("public/data")) {
              const m = /^pull-torneios(\d+)\.json$/.exec(f);
              if (!m) continue;
              let d; try { d = JSON.parse(fs.readFileSync("public/data/" + f, "utf8")); } catch { continue; }
              for (const t of d.tournaments || []) {
                const cc = String(t.ccode), tc = String(t.tcode);
                if (/^9\d{4}$/.test(tc)) stub.set(cc + "/" + tc, { idx: m[1], rounds: t.rounds || 1 });
                else if (/^\d+$/.test(tc)) maxReal.set(cc, Math.max(maxReal.get(cc) || 0, parseInt(tc, 10)));
              }
            }

            const out = [];
            for (const { file, adopt } of FICHEIROS) {
              let d; try { d = JSON.parse(fs.readFileSync(file, "utf8")); } catch { continue; }
              for (const t of d.tournaments || []) {
                const cc = String(t.ccode), tc = String(t.tcode);
                if (!/^9\d{4}$/.test(tc) || t.drawOnly !== true) continue;
                if (forced) { if (tc !== forced) continue; }
                else if (!t.date || t.date > today || t.date < cut) continue;
                const st = stub.get(cc + "/" + tc);
                if (!st) { console.error("aviso: " + cc + "/" + tc + " sem stub em pull-torneios — saltado"); continue; }
                const base = maxReal.get(cc) || 0;
                if (!base) { console.error("aviso: " + cc + " sem tcode real conhecido — saltado"); continue; }
                out.push([cc, tc, file.split("/").pop(), st.idx, base - 6, base + 25, st.rounds, adopt].join(":"));
              }
            }
            console.log(out.join(" "));
          ')
          echo "list=$LIST" >> $GITHUB_OUTPUT
          if [ -z "$LIST" ]; then
            echo "ℹ️  Nenhum torneio draw-only pendente na janela (hoje-3d..hoje) — nada a fazer."
          else
            echo "Pendentes: $LIST"
          fi
        env:
          INPUT_PLACEHOLDER: ${{ github.event.inputs.placeholder }}

      - name: Setup Node.js
        if: steps.pending.outputs.list != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        if: steps.pending.outputs.list != ''
        run: npm ci

      - name: Correr update-cgss-draw-results.js (cada pendente)
        if: steps.pending.outputs.list != ''
        id: scrape
        run: |
          set +e
          UPDATED=0
          FAILED=0
          for SPEC in ${{ steps.pending.outputs.list }}; do
            IFS=':' read -r CC TC DFILE PULL PF PT MINR ADOPT <<< "$SPEC"
            ARGS="--placeholder $TC --ccode $CC --draws-file $DFILE --pull $PULL"
            ARGS="$ARGS --probe-from $PF --probe-to $PT --min-rounds $MINR"
            [ "$ADOPT" = "1" ] && ARGS="$ARGS --adopt-name"
            if [ -n "${{ github.event.inputs.search }}" ]; then ARGS="$ARGS --search \"${{ github.event.inputs.search }}\""; fi
            if [ -n "${{ github.event.inputs.tcode }}" ]; then ARGS="$ARGS --tcode ${{ github.event.inputs.tcode }}"; fi
            echo "── $CC/$TC ──  ($ARGS)"
            eval node scripts/update-cgss-draw-results.js $ARGS
            CODE=$?
            case "$CODE" in
              0) UPDATED=1 ;;
              2) echo "ℹ️  $CC/$TC: ainda sem resultados completos publicados." ;;
              *) echo "❌ $CC/$TC: erro (exit $CODE)"; FAILED=1 ;;
            esac
          done
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}
          FPG_ADMISSIONS_COOKIES: ${{ secrets.FPG_ADMISSIONS_COOKIES }}

      # O /draws lê o manuel-pairings.json, que é GERADO — sem isto o torneio
      # ficava lá com o tcode placeholder e sem scores.
      - name: Regenerar pairings
        if: steps.scrape.outputs.updated == '1'
        continue-on-error: true
        run: node scripts/pairings-build.js

      - name: Commit e push (se houve resultados)
        if: steps.scrape.outputs.updated == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/pull-torneios*.json public/data/cgss-draws-manual.json \
                  public/data/pja-draws-manual.json public/data/fpg-admissions-draws.json \
                  public/data/manuel-pairings.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          git commit -m "data: resultados de torneio draw-only (placeholder → tcode real)"

          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || { git rebase --abort 2>/dev/null || true; sleep $((i * 5)); continue; }
            if git push; then PUSH_OK=1; break; fi
            echo "Push tentativa $i falhou — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ Commit feito"

      - name: Aviso por email (issue criada e fechada — como o daily-digest)
        if: steps.scrape.outputs.updated == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh issue create \
            --title "⛳ Resultados publicados no site ($(date -u +%Y-%m-%d))" \
            --body "@Medeirosgolfdev — o workflow apanhou os resultados dos pendentes (${{ steps.pending.outputs.list }}), re-chaveou o(s) placeholder(s) para o(s) tcode(s) reais e reconciliou os fedCodes dos draws. Ver em https://golf-fpg.vercel.app/FPG. Esta issue fecha-se sozinha — serve só para a notificação por email.")
          gh issue close "$URL" --comment "Notificação entregue."

      - name: Falhar o job se algum pendente deu erro real
        if: steps.scrape.outputs.failed == '1'
        run: |
          echo "❌ Pelo menos um placeholder falhou com erro real (ver logs acima)."
          exit 1
