name: Actualizar Ordem de Mérito Júnior CGSS

# Reconstrói o ranking da categoria JÚNIOR (0-18) das Ordens de Mérito do
# CG Santo da Serra — a única categoria que a FPG não publica.
# scripts/build-om-cgss-junior.js deriva as provas + nível das OMs adultas
# oficiais e filtra os juniores de cada prova (ver cabeçalho do script).
#
# Corre 1×/semana (Domingo à noite, depois dos scrapes de torneios) e a pedido.
#
# Requer GitHub Secret:
#   DATAGOLF_SCORING_COOKIES — cookie header de scoring.datagolf.pt
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Época (ano) a construir'
        required: false
        default: '2026'
  schedule:
    # Domingo 22:30 UTC — depois de update-drive (21:00) e update-classif.
    - cron: '30 22 * * 0'

permissions:
  contents: write

# Uma corrida de cada vez deste workflow: a seguinte espera (não cancela a
# que está a correr). Entre workflows diferentes quem resolve é o
# scripts/ci/push-generated.sh — ver docs/claude/workflows.md, «Push dos dados».
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-om-junior:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Construir Ordem de Mérito Júnior
        id: build
        run: |
          set +e
          node scripts/build-om-cgss-junior.js --year "${{ github.event.inputs.year || '2026' }}"
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = escrito/alterado → commit · 2 = sem alterações → skip · 1 = erro
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ build falhou (cookies expirados?) — ver logs"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem alterações — a saltar o commit"
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      - name: Commit e push (se houver alterações)
        if: steps.build.outputs.exit_code == '0'
        run: |
          bash scripts/ci/push-generated.sh -m "data: Ordem de Mérito Júnior CGSS $(date +'%Y-%m-%d %H:%M')" \
            -- public/data/om-cgss-junior.json
