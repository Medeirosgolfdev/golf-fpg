name: Actualizar Classificações FPG

# Corre:
#  - Automaticamente Dom/Seg 01:00 UTC (depois do update-data às 00:05 apanhar
#    os SDs) — processa torneios que têm admissions/draws mas ainda não têm
#    classif ou scorecards completos.
#  - A pedido (botão "Run workflow" no GitHub)
#
# SCOPE (default do cron): dinâmico via --auto-from-tracking.
#   O script scrape-classif-node.js lê public/data/fpg-tournaments-tracking.json
#   (gerado pelo build-tournaments-tracking.js, que corre no workflow
#   update-fpg-admissions-draws depois de cada scrape) e processa apenas os
#   torneios com status "missing_classif" ou "missing_scorecards".
#
# Fallback manual: workflow_dispatch aceita --tclub/--tcode ou --scope.
#
# Substitui o antigo pull-torneios.js (browser console F12).
#
# Requer GitHub Secret:
#   DATAGOLF_SCORING_COOKIES — cookie header de scoring.datagolf.pt
on:
  workflow_dispatch:
    inputs:
      tclub:
        description: 'tclub específico (ex: 000). Vazio = auto-from-tracking.'
        required: false
        default: ''
      tcode:
        description: 'tcode específico (ex: 10825). Requer tclub.'
        required: false
        default: ''
      scope_file:
        description: 'Ficheiro de scope alternativo (relative ao repo). Sobrepõe tracking.'
        required: false
        default: ''
      out_file:
        description: 'Ficheiro de output.'
        required: false
        default: 'public/data/pull-torneios002.json'
      force_commit:
        description: 'Commit mesmo sem mudanças?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # Dom/Seg 01:00 UTC — 55min depois do update-data (00:05) para não colidir
    # no git push. Por essa altura o SD já foi atribuído pela FPG e o
    # tracking JSON é fresco (actualizado no update-fpg-admissions-draws das
    # 20:00 UTC da véspera).
    - cron: '0 1 * * 0,1'

permissions:
  contents: write

# Uma corrida de cada vez deste workflow: a seguinte espera (não cancela a
# que está a correr). Entre workflows diferentes quem resolve é o
# scripts/ci/push-generated.sh — ver docs/claude/workflows.md, «Push dos dados».
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-classif:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-classif-node.js
        id: scrape
        run: |
          set +e
          # Preferência: input explícito > scope file > auto-from-tracking
          if [ -n "${{ github.event.inputs.tclub }}" ] && [ -n "${{ github.event.inputs.tcode }}" ]; then
            ARGS="--tclub ${{ github.event.inputs.tclub }} --tcode ${{ github.event.inputs.tcode }}"
          elif [ -n "${{ github.event.inputs.scope_file }}" ]; then
            ARGS="--scope ${{ github.event.inputs.scope_file }}"
          else
            ARGS="--auto-from-tracking"
          fi
          ARGS="$ARGS --out ${{ github.event.inputs.out_file || 'public/data/pull-torneios002.json' }}"
          echo "Args: $ARGS"
          node scripts/scrape-classif-node.js $ARGS
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper falhou"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem novidades"
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      # Drena o scope de torneios recentes com >5 dos nossos que ainda não têm
      # leaderboard completa (public/data/recent-tournaments-scrape-scope.json,
      # gerado pelo update-data.yml, ordenado por nº de nossos desc). Cap por
      # run (--limit) para não estourar o timeout; o merge é aditivo e o scope
      # encolhe a cada semana à medida que os torneios ficam scrapeados.
      # Escreve no ficheiro-cauda (pull-torneios-tail.cjs) para manter ~120
      # torneios por ficheiro; roda para o índice seguinte quando enche.
      - name: Scrapar torneios recentes com muitos dos nossos (>5)
        id: scrape_recent
        if: github.event_name == 'schedule' || github.event.inputs.tclub == ''
        run: |
          set +e
          SCOPE="public/data/recent-tournaments-scrape-scope.json"
          if [ ! -s "$SCOPE" ]; then
            echo "ℹ️  Sem scope de torneios recentes ($SCOPE) — nada a drenar."
            echo "exit_code=2" >> $GITHUB_OUTPUT
            exit 0
          fi
          OUT_RECENT=$(node scripts/pull-torneios-tail.cjs)
          echo "Ficheiro-cauda para novos torneios: $OUT_RECENT"
          node scripts/scrape-classif-node.js --scope "$SCOPE" --limit 80 \
            --out "$OUT_RECENT" --concurrency 2
          EC=$?
          echo "exit_code=$EC" >> $GITHUB_OUTPUT
          # Falha real não aborta (o passo principal ainda se publica), mas o
          # job acaba vermelho no fim — passo «Falhar se algum passo falhou».
          if [ "$EC" != "0" ] && [ "$EC" != "2" ]; then echo "::error::scrape de recentes falhou (exit $EC)"; fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      # Quadros de match play da Taça FPG (scoring-pt.datagolf.pt/scripts/matchplay.asp,
      # HTML público, sem cookies) → public/data/fpg-matchplay.json. A lista dos
      # quadros está em SOURCES no script. 0 gravou · 2 nada de novo · 3 FPG em
      # baixo (não é erro nosso) · 1 erro → vermelho no fim.
      - name: Quadros de match play (Taça FPG)
        id: matchplay
        if: github.event_name == 'schedule' || github.event.inputs.tclub == ''
        run: |
          set +e
          node scripts/scrape-fpg-matchplay.js
          EC=$?
          echo "exit_code=$EC" >> $GITHUB_OUTPUT
          if [ "$EC" = "3" ]; then echo "ℹ️  FPG em baixo — fica para a próxima corrida."; fi
          if [ "$EC" = "1" ]; then echo "::error::scrape-fpg-matchplay falhou"; fi
          exit 0

      # PCC do próprio fim-de-semana. Este workflow corre à 01:00 UTC, 55 min
      # depois do update-data.yml ter descarregado o WHS (00:05) — que é quem
      # traz o `cba` oficial. Os torneios acabados de scrapar aqui apanham logo
      # o PCC em vez de esperar pela varredura do domingo seguinte. O
      # ClassifLST não o publica a tempo: a FPG só o calcula ao fim do dia.
      - name: Preencher PCC dos torneios acabados de scrapar
        if: steps.scrape.outputs.exit_code == '0' || (steps.scrape_recent.outcome == 'success' && steps.scrape_recent.outputs.exit_code == '0')
        id: pcc
        run: |
          set +e
          node scripts/backfill-pcc.js --apply
          EC=$?
          # 2 = nada a preencher (não é erro); falha real → vermelho no fim.
          if [ "$EC" != "0" ] && [ "$EC" != "2" ]; then
            echo "::error::backfill-pcc falhou (exit $EC)"; echo "failed=1" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Regenerar tracking (após novos dados de classif)
        if: steps.scrape.outputs.exit_code == '0' || (steps.scrape_recent.outcome == 'success' && steps.scrape_recent.outputs.exit_code == '0')
        run: node scripts/build-tournaments-tracking.js

      - name: Commit e push (se houver novos dados)
        if: steps.scrape.outputs.exit_code == '0' || (steps.scrape_recent.outcome == 'success' && steps.scrape_recent.outputs.exit_code == '0') || steps.matchplay.outputs.exit_code == '0' || github.event.inputs.force_commit == 'true'
        # O fpg-tournaments-tracking.json é gerado por mais do que um workflow:
        # -f tracking regenera-o por cima do main mais recente em vez de o fundir.
        # drive/aquapor entram porque o backfill-pcc também lhes toca (fusão a 3
        # com o update-drive, se ambos mexerem).
        run: |
          OUT="${{ github.event.inputs.out_file || 'public/data/pull-torneios002.json' }}"
          bash scripts/ci/push-generated.sh -m "data: update classif FPG $(date +'%Y-%m-%d %H:%M')" \
            -f tracking \
            -- "$OUT" 'public/data/pull-torneios*.json' \
               'public/data/drive-data-*.json' 'public/data/aquapor-data-*.json'                public/data/fpg-matchplay.json

      # Falhas que não travaram o commit não podem ficar verdes.
      - name: Falhar se algum passo falhou
        if: always() && (steps.pcc.outputs.failed == '1' || steps.matchplay.outputs.exit_code == '1' || (steps.scrape_recent.outputs.exit_code != '' && steps.scrape_recent.outputs.exit_code != '0' && steps.scrape_recent.outputs.exit_code != '2'))
        run: |
          echo "❌ Falhou: scrape de recentes (exit ${{ steps.scrape_recent.outputs.exit_code }}) / backfill-pcc (${{ steps.pcc.outputs.failed }}) / match play (exit ${{ steps.matchplay.outputs.exit_code }})"
          echo "O que correu bem já foi publicado — ver os ::error:: acima."
          exit 1
