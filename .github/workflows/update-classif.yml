name: Actualizar Classificações FPG

# Corre:
#  - Automaticamente Dom/Seg 01:00 UTC (depois do update-data às 00:05 apanhar
#    os SDs) — processa torneios que têm admissions/draws mas ainda não têm
#    classif ou scorecards completos.
#  - A pedido (botão "Run workflow" no GitHub)
#
# SCOPE (default do cron): dinâmico via --auto-from-tracking.
#   O script scrape-classif-node.js lê public/data/fpg-tournaments-tracking.json
#   (gerado pelo build-tournaments-tracking.js, que corre no workflow
#   update-fpg-admissions-draws depois de cada scrape) e processa apenas os
#   torneios com status "missing_classif" ou "missing_scorecards".
#
# Fallback manual: workflow_dispatch aceita --tclub/--tcode ou --scope.
#
# Substitui o antigo pull-torneios.js (browser console F12).
#
# Requer GitHub Secret:
#   DATAGOLF_SCORING_COOKIES — cookie header de scoring.datagolf.pt
on:
  workflow_dispatch:
    inputs:
      tclub:
        description: 'tclub específico (ex: 000). Vazio = auto-from-tracking.'
        required: false
        default: ''
      tcode:
        description: 'tcode específico (ex: 10825). Requer tclub.'
        required: false
        default: ''
      scope_file:
        description: 'Ficheiro de scope alternativo (relative ao repo). Sobrepõe tracking.'
        required: false
        default: ''
      out_file:
        description: 'Ficheiro de output.'
        required: false
        default: 'public/data/pull-torneios002.json'
      force_commit:
        description: 'Commit mesmo sem mudanças?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # Dom/Seg 01:00 UTC — 55min depois do update-data (00:05) para não colidir
    # no git push. Por essa altura o SD já foi atribuído pela FPG e o
    # tracking JSON é fresco (actualizado no update-fpg-admissions-draws das
    # 20:00 UTC da véspera).
    - cron: '0 1 * * 0,1'

permissions:
  contents: write

jobs:
  update-classif:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-classif-node.js
        id: scrape
        run: |
          set +e
          # Preferência: input explícito > scope file > auto-from-tracking
          if [ -n "${{ github.event.inputs.tclub }}" ] && [ -n "${{ github.event.inputs.tcode }}" ]; then
            ARGS="--tclub ${{ github.event.inputs.tclub }} --tcode ${{ github.event.inputs.tcode }}"
          elif [ -n "${{ github.event.inputs.scope_file }}" ]; then
            ARGS="--scope ${{ github.event.inputs.scope_file }}"
          else
            ARGS="--auto-from-tracking"
          fi
          ARGS="$ARGS --out ${{ github.event.inputs.out_file || 'public/data/pull-torneios002.json' }}"
          echo "Args: $ARGS"
          node scripts/scrape-classif-node.js $ARGS
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper falhou"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem novidades"
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      # Drena o scope de torneios recentes com >5 dos nossos que ainda não têm
      # leaderboard completa (public/data/recent-tournaments-scrape-scope.json,
      # gerado pelo update-data.yml, ordenado por nº de nossos desc). Cap por
      # run (--limit) para não estourar o timeout; o merge é aditivo e o scope
      # encolhe a cada semana à medida que os torneios ficam scrapeados.
      # Escreve no ficheiro-cauda (pull-torneios-tail.cjs) para manter ~120
      # torneios por ficheiro; roda para o índice seguinte quando enche.
      - name: Scrapar torneios recentes com muitos dos nossos (>5)
        id: scrape_recent
        if: github.event_name == 'schedule' || github.event.inputs.tclub == ''
        run: |
          set +e
          SCOPE="public/data/recent-tournaments-scrape-scope.json"
          if [ ! -s "$SCOPE" ]; then
            echo "ℹ️  Sem scope de torneios recentes ($SCOPE) — nada a drenar."
            echo "exit_code=2" >> $GITHUB_OUTPUT
            exit 0
          fi
          OUT_RECENT=$(node scripts/pull-torneios-tail.cjs)
          echo "Ficheiro-cauda para novos torneios: $OUT_RECENT"
          node scripts/scrape-classif-node.js --scope "$SCOPE" --limit 80 \
            --out "$OUT_RECENT" --concurrency 2
          EC=$?
          echo "exit_code=$EC" >> $GITHUB_OUTPUT
          if [ "$EC" = "1" ]; then echo "⚠ scrape de recentes falhou (não aborta o workflow)"; fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      - name: Regenerar tracking (após novos dados de classif)
        if: steps.scrape.outputs.exit_code == '0' || (steps.scrape_recent.outcome == 'success' && steps.scrape_recent.outputs.exit_code == '0')
        run: node scripts/build-tournaments-tracking.js

      - name: Commit e push (se houver novos dados)
        if: steps.scrape.outputs.exit_code == '0' || (steps.scrape_recent.outcome == 'success' && steps.scrape_recent.outputs.exit_code == '0') || github.event.inputs.force_commit == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          OUT="${{ github.event.inputs.out_file || 'public/data/pull-torneios002.json' }}"
          # glob cobre o ficheiro-cauda (seja 006, 007, ...) + o $OUT (002).
          git add "$OUT" public/data/pull-torneios*.json public/data/fpg-tournaments-tracking.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: update classif FPG ${DATE}"
          # Push robusto: retry com pull --rebase em cada tentativa.
          # O fpg-tournaments-tracking.json é REGENERADO por inteiro por mais
          # do que um workflow → um rebase nunca resolve conflitos nele sozinho.
          # Estratégia: se o rebase conflitar no tracking, resolver com a nossa
          # versão e REGENERAR o ficheiro sobre o estado pós-pull (o script é
          # determinístico: lê public/data/ e reescreve tudo), amendando o commit.
          TRACKING="public/data/fpg-tournaments-tracking.json"
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              # Conflito de rebase. Se for só no tracking, resolver e continuar.
              if git diff --name-only --diff-filter=U | grep -qx "$TRACKING" \
                 && [ "$(git diff --name-only --diff-filter=U | wc -l)" = "1" ]; then
                echo "Conflito no tracking — a resolver com regeneração"
                git checkout --theirs "$TRACKING"
                git add "$TRACKING"
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort 2>/dev/null || true
                  echo "Rebase não recuperou na tentativa $i — retry em $((i * 5))s"
                  sleep $((i * 5))
                  continue
                fi
              else
                git rebase --abort 2>/dev/null || true
                echo "Conflito fora do tracking na tentativa $i — retry em $((i * 5))s"
                sleep $((i * 5))
                continue
              fi
            fi
            # Pós-pull: regenerar o tracking com TODOS os dados (nossos + dos
            # pushes concorrentes que acabámos de integrar) e amendar se mudou.
            node scripts/build-tournaments-tracking.js
            if ! git diff --quiet -- "$TRACKING"; then
              git add "$TRACKING"
              git commit --amend --no-edit
            fi
            if git push; then
              PUSH_OK=1
              break
            fi
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ Commit feito"
