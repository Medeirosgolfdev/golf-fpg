name: Actualizar Admissions + Draws FPG

# Corre:
#  - Automaticamente Sex/Sáb/Dom às 20:00 UTC (~21:00 Lisboa)
#  - A pedido (botão "Run workflow" no GitHub)
#
# Cron desfasado dos outros workflows (20:00 em vez de 21:00/21:20/21:40)
# para evitar colisões no git push.
#
# Scrapes TUDO: 333 torneios em scripts/fpg-admissions-scope.json
# (Jovens 2022-2025, Drive/Aquapor 2025-2026, Finais, Nacional 2026).
#
# Requer GitHub Secret:
#   FPG_ADMISSIONS_COOKIES — cookie header capturado de scoring.fpg.pt
#                            formato: "ASP.NET_SessionId=XXX; ..."
on:
  workflow_dispatch:
    inputs:
      tcodes:
        description: 'Tcodes específicos separados por vírgula (ex: 10941,10937). Vazio = scope todo.'
        required: false
        default: ''
      since:
        description: 'Só torneios >= esta data (YYYY-MM-DD). Vazio = sem filtro.'
        required: false
        default: ''
      year:
        description: 'Só torneios deste ano (ex: 2026). Vazio = sem filtro.'
        required: false
        default: ''
      force_commit:
        description: 'Commit mesmo sem mudanças?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # 20:00 UTC Sex/Sáb/Dom — admissions abrem-se à Sexta, fecham-se ao Domingo
    - cron: '0 20 * * 5,6,0'

permissions:
  contents: write

jobs:
  update-fpg-admissions-draws:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-fpg-admissions-draws-node.js
        id: scrape
        run: |
          set +e
          ARGS=""
          if [ -n "${{ github.event.inputs.tcodes }}" ]; then
            ARGS="$ARGS --tcodes ${{ github.event.inputs.tcodes }}"
          fi
          if [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          fi
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          echo "Args: $ARGS"
          node scripts/scrape-fpg-admissions-draws-node.js $ARGS
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = há dados novos → commit
          # 2 = nada novo → não commit (NÃO é erro)
          # 1 = erro real
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper falhou — ver logs acima"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Nenhum dado novo — a saltar o commit"
          fi
          exit 0
        env:
          FPG_ADMISSIONS_COOKIES: ${{ secrets.FPG_ADMISSIONS_COOKIES }}

      - name: Commit e push (se houver novos dados)
        if: steps.scrape.outputs.exit_code == '0' || github.event.inputs.force_commit == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/fpg-admissions-draws.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: update FPG admissions+draws ${DATE}"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || git rebase --abort
          git push
          echo "✓ Commit feito"
