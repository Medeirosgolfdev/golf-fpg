name: Actualizar Admissions + Draws FPG

# Corre:
#  - Automaticamente Sex/Sáb/Dom às 20:00 UTC (~21:00 Lisboa)
#  - A pedido (botão "Run workflow" no GitHub)
#
# Cron desfasado dos outros workflows (20:00 em vez de 21:00/21:20/21:40)
# para evitar colisões no git push.
#
# Scrapes TUDO: 333 torneios em scripts/fpg-admissions-scope.json
# (Jovens 2022-2025, Drive/Aquapor 2025-2026, Finais, Nacional 2026).
#
# Requer GitHub Secrets:
#   FPG_ADMISSIONS_COOKIES — cookie header capturado de scoring.fpg.pt
#                            formato: "ASP.NET_SessionId=XXX; ..."
#   DATAGOLF_SCORING_COOKIES — cookie header de scoring.datagolf.pt
#                              (usado pela Fonte 3 do --auto-extend para
#                              descobrir torneios novos via TournamentsLST)
on:
  workflow_dispatch:
    inputs:
      tcodes:
        description: 'Tcodes específicos separados por vírgula (ex: 10941,10937). Sobrepõe-se ao default do cron.'
        required: false
        default: ''
      ccode:
        description: 'Club code (ex: 004). Default 000 se vazio. Aplica-se a todos os tcodes acima.'
        required: false
        default: ''
      since:
        description: 'Só torneios >= esta data (YYYY-MM-DD). Vazio = scope completo (todos os 333).'
        required: false
        default: ''
      year:
        description: 'Só torneios deste ano (ex: 2026).'
        required: false
        default: ''
      force_commit:
        description: 'Commit mesmo sem mudanças?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # Sex/Sáb/Dom 20:00 UTC — admissions abrem-se à Sexta, fecham-se ao Domingo.
    # O cron aplica `--auto-extend` (descobre torneios novos via JSONs locais +
    # TournamentsLST com filtros PJA/junior/jovens/sub-XX/ccode=007) e
    # `--since 4d` (torneios futuros + em curso + torneios de 3 rondas até dia
    # seguinte ao fim). Para scrape histórico completo sem filtros, usar
    # workflow_dispatch sem parâmetros.
    - cron: '0 20 * * 5,6,0'

permissions:
  contents: write

jobs:
  update-fpg-admissions-draws:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-fpg-admissions-draws-node.js
        id: scrape
        run: |
          set +e
          ARGS=""
          # Filtros explícitos (workflow_dispatch) sobrepõem-se ao default
          if [ -n "${{ github.event.inputs.tcodes }}" ]; then
            ARGS="$ARGS --tcodes ${{ github.event.inputs.tcodes }}"
            if [ -n "${{ github.event.inputs.ccode }}" ]; then
              ARGS="$ARGS --ccode ${{ github.event.inputs.ccode }}"
            fi
          elif [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          elif [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          else
            # Default do cron:
            #   1) --auto-extend → expande scope manual (333) com:
            #        Fonte 2: public/data/drive-data-*, jovens_*, pull-torneios*, SdS
            #        Fonte 3: TournamentsLST (com warmup entry-gate) filtrado por
            #                 INCLUDES (junior|PJA|jovens|sub-XX|ccode=007) e
            #                 EXCLUDES (Flintstones, Quarta Feira Europeia)
            #   2) --since 4 dias atrás → janela para apanhar: futuros + em curso +
            #        torneios de 3 rondas no dia seguinte ao fim (cobre Nacionais Jovens)
            # Para scope histórico completo sem filtro: workflow_dispatch sem parâmetros.
            SINCE_DATE=$(date -d "4 days ago" +%Y-%m-%d)
            ARGS="--auto-extend --since $SINCE_DATE"
            echo "ℹ️  Default do cron: auto-extend + --since $SINCE_DATE"
          fi
          echo "Args: $ARGS"
          node scripts/scrape-fpg-admissions-draws-node.js $ARGS
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = há dados novos → commit
          # 2 = nada novo → não commit (NÃO é erro)
          # 1 = erro real
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper falhou — ver logs acima"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Nenhum dado novo — a saltar o commit"
          fi
          exit 0
        env:
          FPG_ADMISSIONS_COOKIES: ${{ secrets.FPG_ADMISSIONS_COOKIES }}
          # auto-extend Fonte 3 usa TournamentsLST de scoring.datagolf.pt
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      - name: Regenerar tracking de torneios
        # Corre SEMPRE (mesmo com exit_code=2 sem mudanças novas), porque o
        # tracking também usa drive-data-*, jovens_*, pull-torneios* — esses
        # podem ter mudado via outros workflows entretanto.
        if: steps.scrape.outputs.exit_code != '1'
        run: node scripts/build-tournaments-tracking.js

      - name: Validar dados scrapados
        if: steps.scrape.outputs.exit_code != '1'
        run: node scripts/validate-data.js public/data/fpg-admissions-draws.json

      - name: Regenerar manuel-pairings.json
        id: pairings
        # A página /draws (companheiros do Manuel) lê public/data/manuel-pairings.json,
        # que o pairings-build.js gera a partir do fpg-admissions-draws.json (entre
        # outras fontes já commitadas). Corre SEMPRE (excepto erro do scraper) e marca
        # pairings_changed=true para o commit acontecer mesmo quando o scraper não
        # trouxe nada novo mas os draws mudaram (ex: draws adicionados manualmente).
        if: steps.scrape.outputs.exit_code != '1'
        run: |
          node scripts/pairings-build.js
          if git diff --quiet -- public/data/manuel-pairings.json; then
            echo "pairings_changed=false" >> $GITHUB_OUTPUT
          else
            echo "pairings_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit e push (se houver novos dados)
        if: steps.scrape.outputs.exit_code == '0' || steps.pairings.outputs.pairings_changed == 'true' || github.event.inputs.force_commit == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/fpg-admissions-draws.json public/data/fpg-tournaments-tracking.json public/data/manuel-pairings.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: update FPG admissions+draws ${DATE}"
          # Push robusto: retry com pull --rebase em cada tentativa.
          # O fpg-tournaments-tracking.json é REGENERADO por inteiro por mais
          # do que um workflow → um rebase nunca resolve conflitos nele sozinho.
          # Estratégia: se o rebase conflitar no tracking, resolver com a nossa
          # versão e REGENERAR o ficheiro sobre o estado pós-pull (o script é
          # determinístico: lê public/data/ e reescreve tudo), amendando o commit.
          TRACKING="public/data/fpg-tournaments-tracking.json"
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              # Conflito de rebase. Se for só no tracking, resolver e continuar.
              if git diff --name-only --diff-filter=U | grep -qx "$TRACKING" \
                 && [ "$(git diff --name-only --diff-filter=U | wc -l)" = "1" ]; then
                echo "Conflito no tracking — a resolver com regeneração"
                git checkout --theirs "$TRACKING"
                git add "$TRACKING"
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort 2>/dev/null || true
                  echo "Rebase não recuperou na tentativa $i — retry em $((i * 5))s"
                  sleep $((i * 5))
                  continue
                fi
              else
                git rebase --abort 2>/dev/null || true
                echo "Conflito fora do tracking na tentativa $i — retry em $((i * 5))s"
                sleep $((i * 5))
                continue
              fi
            fi
            # Pós-pull: regenerar o tracking com TODOS os dados (nossos + dos
            # pushes concorrentes que acabámos de integrar) e amendar se mudou.
            node scripts/build-tournaments-tracking.js
            if ! git diff --quiet -- "$TRACKING"; then
              git add "$TRACKING"
              git commit --amend --no-edit
            fi
            if git push; then
              PUSH_OK=1
              break
            fi
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ Commit feito"
