name: Actualizar Swiss Golf (Suíça)

# Provas juvenis da Swiss Golf no GolfBox (customer 1085): Junior Tour, National
# Events U14, National Championships U10–U18 e finais. scripts/scrape-swissgolf.js
# lê o calendário da época corrente e da anterior e grava
# public/data/swissgolf/{competitionId}.json; se algum mudou, regenera o kids2.
#
# API PÚBLICA → SEM secrets/cookies.
#
# Corre:
#  - Domingo às 19:30 UTC — as provas juvenis suíças são ao fim-de-semana.
#  - Segunda às 06:30 UTC — apanha o fecho de domingo.
#  - A pedido, com números de competição GolfBox ad-hoc ou outras épocas.
#
# Nota: o commit é self-contained (scrape + agregador) porque um push feito com
# GITHUB_TOKEN não dispara o build-juniors.yml (regra anti-recursão do GitHub).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'competitionId(s) GolfBox separados por vírgula (vazio = calendário)'
        required: false
        default: ''
        type: string
      anos:
        description: 'épocas separadas por vírgula (vazio = a corrente e a anterior)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '30 19 * * 0'
    - cron: '30 6 * * 1'

permissions:
  contents: write

jobs:
  update-swissgolf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: update-swissgolf
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-swissgolf.js
        id: scrape
        run: |
          set +e
          IDS="${{ github.event.inputs.ids }}"
          ANOS="${{ github.event.inputs.anos }}"
          if [ -n "$IDS" ]; then
            node scripts/scrape-swissgolf.js --ids "$IDS"
          elif [ -n "$ANOS" ]; then
            node scripts/scrape-swissgolf.js --anos "$ANOS"
          else
            node scripts/scrape-swissgolf.js
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = houve novidades → regenerar canónico + commit
          # 2 = sem alterações → no-op (NÃO é erro)
          # 1 = erro real
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper Swiss Golf falhou — ver logs acima"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem alterações — a saltar regeneração e commit"
          fi
          exit 0

      - name: Regenerar juniores canónicos (agregador)
        if: steps.scrape.outputs.exit_code == '0'
        run: node scripts/aggregator/index.js

      - name: Commit e push (se houve alterações)
        if: steps.scrape.outputs.exit_code == '0'
        # -f agregador: juniors*.json & c.ª regenerados (nunca fundidos) se o main avançar.
        run: |
          bash scripts/ci/push-generated.sh -m "data: Swiss Golf scrape + rebuild juniors $(date +'%Y-%m-%d %H:%M')" \
            -f agregador -- public/data
