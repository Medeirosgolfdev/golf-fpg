name: USKids Refresh All
on:
  schedule:
    # Segunda-feira às 09:00 UTC. Semanal (era mensal — ficávamos muito
    # desfasados). Janela escolhida ENTRE o field (07:00) e o results (16:00)
    # e longe do incremental das 16:30 (que dura ~2h40m, até ~19:10) e do
    # rich das 02:00 — evita sobreposição no git push. É um re-fetch COMPLETO
    # de todos os memberIDs em cache (apanha torneios jogados fora dos
    # ALL_TCODES), por isso não precisa de correr depois do diário.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Razão para correr manualmente (opcional)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  refresh:
    name: 🔄 Refresh All Members
    runs-on: ubuntu-latest
    # Timeout generoso: ~2.600 jogadores × 150ms ≈ 7-10 min em teoria,
    # mas com latência variável e checkpoints pode chegar a 30-40 min.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Re-fetch todos os memberIDs em cache
        run: node scripts/fetch-uskids-member-history.js --refresh-all
      # O fetch já escreve directamente chunks uskids-member-history-NNN.json
      # (≤ 85 MB) — não há monolítico (o JSON.stringify do objecto inteiro
      # passava o limite de string do V8 e rebentava). O split corre em modo
      # --from-chunks: consolida os chunks do fetch e re-equilibra para ≤ 70 MB,
      # ~30 % abaixo do hard-limit de 100 MB do GitHub. Os chunks alimentam o
      # build-slim e ficam em git como cache para o próximo run do fetch.
      - run: node scripts/split-member-history.js --from-chunks --target-mb=70
      - run: node scripts/build-member-history-slim.js
      - name: Commit se houve alterações
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # IMPORTANTE: o glob TEM de estar entre aspas. Sem aspas, o bash
          # expande-o antes do git ver e só passa os ficheiros que ainda
          # existem no disco — as deletions de chunks antigos (003-046, etc.)
          # são silenciosamente ignoradas. Com aspas, é o git a fazer o
          # pathspec matching, que inclui o índice e apanha as deletions.
          git add -A 'data-archive/uskids-member-history-*.json'
          git add public/data/uskids-member-history-slim.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh-all USKids histórico [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Push robusto: COMMIT primeiro, depois pull --rebase --autostash em
          # cada tentativa. O autostash guarda ficheiros não-committados (caches,
          # run-summaries que o fetch toca) durante o rebase — sem isto, o antigo
          # `git merge origin/main` falhava com "local changes would be
          # overwritten by merge" e derrubava o workflow (caso 2026-07-01).
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push; then
              PUSH_OK=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
