name: Actualizar DGV (Alemanha)

# Provas juvenis do Deutscher Golf Verband: Deutsche Meisterschaften AK 14/16/18,
# DM-Vorausscheide, DMM da juventude e German International Boys/Girls.
# scripts/scrape-dgv.js lê a API pública do calendário golf.de (lista em GraphQL,
# resultados em /v1.0/tournaments/{n}/results) e grava public/data/dgv_{n}.json.
# Se algum mudou, regenera os ficheiros canónicos do kids2.
#
# API PÚBLICA → SEM secrets/cookies (o X-Client-Id é o que a página golf.de usa).
#
# Corre:
#  - Sex/Sáb/Dom às 19:30 UTC — as provas juvenis alemãs são ao fim-de-semana.
#  - Segunda às 06:00 UTC — apanha o fecho de domingo.
#  - A pedido, com números de torneio ad-hoc ou uma janela maior (histórico).
#
# Nota: o commit é self-contained (scrape + agregador) porque um push feito com
# GITHUB_TOKEN não dispara o build-juniors.yml (regra anti-recursão do GitHub).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'tournamentNumber(s) DGV separados por vírgula (vazio = janela de dias)'
        required: false
        default: ''
        type: string
      from_days:
        description: 'início da janela, em dias a contar de hoje (ex.: -21; -1800 = desde 2022)'
        required: false
        default: '-21'
        type: string
  schedule:
    - cron: '30 19 * * 5,6,0'
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  update-dgv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: update-dgv
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-dgv.js
        id: scrape
        run: |
          set +e
          IDS="${{ github.event.inputs.ids }}"
          FROM="${{ github.event.inputs.from_days }}"
          if [ -n "$IDS" ]; then
            node scripts/scrape-dgv.js --ids "$IDS"
          else
            node scripts/scrape-dgv.js --from "${FROM:--21}" --to 7
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = houve novidades → regenerar canónico + commit
          # 2 = sem alterações → no-op (NÃO é erro)
          # 1 = erro real
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper DGV falhou — ver logs acima"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem alterações — a saltar regeneração e commit"
          fi
          exit 0

      - name: Regenerar juniores canónicos (agregador)
        if: steps.scrape.outputs.exit_code == '0'
        run: node scripts/aggregator/index.js

      - name: Commit e push (se houve alterações)
        if: steps.scrape.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: DGV scrape + rebuild juniors ${DATE}"
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push; then
              PUSH_OK=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ DGV + juniores canónicos actualizados"
