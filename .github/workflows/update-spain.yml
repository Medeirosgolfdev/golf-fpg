name: Actualizar Espanha — RFEG + LGS + NextCaddy + FCG (Node puro)

# Corre:
#   - Automaticamente Segunda-feira às 02:00 UTC (madrugada Lisboa)
#   - A pedido (botão "Run workflow" no GitHub)
#
# Pipeline única que cobre toda a Espanha:
#   • RFEG site novo (calendário + inscritos GolfBox) — scrape-rfeg-competiciones.js
#   • livegolfscoring.com (scorecards hbh + par real) — scrape-livegolfscoring.js
#   • NextCaddy (RFGA Andaluzia + FGM Madrid + outras) — scrape-nextcaddy.js
#   • Federació Catalana de Golf (golfdirecto.com) — scrape-fcg.js
#
# Todos os portais são públicos (sem cookies/secrets). Node puro, sem Playwright.
#
# Default do cron: descoberta + scrape incremental (--skip-existing) + builds.
# Para histórico completo: workflow_dispatch com force_rebuild=true.
#
# Doc canónico: docs/scraping-rfeg-espanha.md
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Re-fetch torneios já em disco? (sem --skip-existing nos scrapers)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_discovery:
        description: 'Saltar descoberta de scopes (usa scope files actuais)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      lgs_range:
        description: 'Range de IDs livegolfscoring (ex: "1-500"). Default: "1-500".'
        required: false
        default: ''
      fcg_years:
        description: 'Anos FCG para discovery (ex: "2025,2026"). Default: "2025,2026".'
        required: false
        default: ''

  schedule:
    # Segunda 02:00 UTC ≈ 02:00 Lisboa (inverno) / 03:00 (BST verão)
    # Madrugada de segunda-feira como pedido. Mesmo timing que update-ffgolf-resultats
    # mas usa janela diferente (FFG corre antes às 02:00, depois GolfGenius às 03:00).
    # Espanha corre depois, às 04:00, para evitar colisões no git push.
    - cron: '0 4 * * 1'

permissions:
  contents: write

# Uma corrida de cada vez deste workflow: a seguinte espera (não cancela a
# que está a correr). Entre workflows diferentes quem resolve é o
# scripts/ci/push-generated.sh — ver docs/claude/workflows.md, «Push dos dados».
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-spain:
    runs-on: ubuntu-latest
    # Cada passo tem o seu timeout-minutes (D8, auditoria 20/10/2026): a 28/09 e
    # 05/10 o NextCaddy ficou pendurado ~200 min e o job foi cancelado às 4h SEM
    # commit — perdeu-se o run inteiro. Agora um portal pendurado expira sozinho
    # (o passo fica «failure», os outros seguem, o commit acontece e a
    # verificação final põe o job vermelho). Run normal: ~20-50 min.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Decidir flags
        id: flags
        run: |
          # Skip-existing por default (incremental). Force_rebuild remove a flag.
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "SKIP_FLAG=" >> $GITHUB_ENV
            echo "skip_existing: false (force_rebuild)"
          else
            echo "SKIP_FLAG=--skip-existing" >> $GITHUB_ENV
            echo "skip_existing: true"
          fi
          # Discovery
          if [ "${{ github.event.inputs.skip_discovery }}" = "true" ]; then
            echo "DO_DISCOVERY=false" >> $GITHUB_ENV
          else
            echo "DO_DISCOVERY=true" >> $GITHUB_ENV
          fi
          # LGS range
          if [ -n "${{ github.event.inputs.lgs_range }}" ]; then
            echo "LGS_RANGE=${{ github.event.inputs.lgs_range }}" >> $GITHUB_ENV
          else
            echo "LGS_RANGE=1-1000" >> $GITHUB_ENV
          fi
          # FCG years
          if [ -n "${{ github.event.inputs.fcg_years }}" ]; then
            echo "FCG_YEARS=${{ github.event.inputs.fcg_years }}" >> $GITHUB_ENV
          else
            echo "FCG_YEARS=2025,2026" >> $GITHUB_ENV
          fi

      # ── Descoberta de scopes (regenera scripts/{fcg,nextcaddy}-scope*.json) ──
      # Exit 2 = o catgolf.com respondeu degradado (0 torneios) e a guarda do
      # script preservou o scope anterior. Não é erro: o scrape a seguir usa o
      # scope bom que já lá estava. Só exit 1 é que é falha a sério.
      - name: Discovery FCG (catgolf.com → fcg-scope.json)
        id: disc_fcg
        if: env.DO_DISCOVERY == 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          node scripts/discover-fcg-scope.js --years "$FCG_YEARS"
          CODE=$?
          set -e
          if [ "$CODE" = "2" ]; then
            echo "ℹ️  catgolf.com degradado — scope FCG anterior preservado."
            exit 0
          fi
          exit $CODE

      - name: Discovery NextCaddy (→ nextcaddy-scope-all.json)
        id: disc_nc
        if: env.DO_DISCOVERY == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/scrape-nextcaddy.js --discover --out scripts/nextcaddy-scope-all.json || [ $? -eq 2 ]

      # ── Scrapers (paralelos seriam ideais mas mantemos sequencial pelo git push) ──
      # RFEG: o site antigo (CompetenciaPaginas/*.aspx) morreu em Set/2026. As
      # provas juvenis saem do calendário novo e os inscritos do GolfBox
      # espanhol; actualiza os rfegolf-resultats/{compId}.json existentes e cria
      # as provas novas (compId = id do post WordPress). Os resultados continuam
      # a vir do mitarjeta/LGS.
      - name: Scrape RFEG (calendário + inscritos GolfBox)
        id: rfegolf
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/scrape-rfeg-competiciones.js || [ $? -eq 2 ]

      - name: Scrape livegolfscoring (scorecards hbh)
        id: lgs
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/scrape-livegolfscoring.js --seasons "2025,2026" --range "$LGS_RANGE" --concurrency 10 $SKIP_FLAG || [ $? -eq 2 ]

      - name: Scrape NextCaddy (leaderboards)
        id: nextcaddy
        continue-on-error: true
        timeout-minutes: 30
        run: |
          SCOPE_FILE="scripts/nextcaddy-scope-all.json"
          if [ ! -f "$SCOPE_FILE" ]; then
            SCOPE_FILE="scripts/nextcaddy-scope.json"
          fi
          echo "Scope: $SCOPE_FILE"
          node scripts/scrape-nextcaddy.js --scope "$SCOPE_FILE" --concurrency 8 $SKIP_FLAG || [ $? -eq 2 ]

      - name: Scrape NextCaddy horários (tee times)
        id: nc_horarios
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/scrape-nextcaddy-horarios.js --all --concurrency 8 $SKIP_FLAG || [ $? -eq 2 ]

      - name: Scrape NextCaddy scorecards (backfill incremental)
        id: nc_scorecards
        continue-on-error: true
        timeout-minutes: 45
        run: |
          # NextCaddy-only JUVENIL: torneios com leaderboard mas sem cartões
          # hole-by-hole (o passo de leaderboards acima não passa --scorecards).
          # --junior salta os ~739 torneios ADULTOS do corpus (Senior/Caballeros/
          # categorias por hcp) que não interessam ao tracking juvenil — só os
          # ~210 juvenis (~6.6k scorecards). Lote limitado (maior gap primeiro),
          # enche via --patch-scorecards a concorrência baixa + retries. O backlog
          # auto-cura ao longo das semanas; o patch só regrava ficheiros que
          # ganharam dados (sem churn).
          node scripts/build-nextcaddy-scorecard-scope.js --junior --limit 80 --out scripts/nextcaddy-scorecard-batch.json
          node scripts/scrape-nextcaddy.js --patch-scorecards --scope scripts/nextcaddy-scorecard-batch.json --concurrency 2 || [ $? -eq 2 ]

      - name: Scrape FCG (golfdirecto.com)
        id: fcg
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if [ ! -f scripts/fcg-scope.json ]; then
            echo "fcg-scope.json não existe — a saltar (discovery FCG falhou?)"
            exit 0
          fi
          # Exit 2 = scope sem jogos ou nada de novo — não é erro.
          set +e
          node scripts/scrape-fcg.js --scope scripts/fcg-scope.json --concurrency 3 $SKIP_FLAG
          CODE=$?
          set -e
          if [ "$CODE" = "2" ]; then
            echo "ℹ️  FCG sem novidades."
            exit 0
          fi
          exit $CODE

      # ── Enrichment + index + lookups (rápidos, não usam rede excepto enrich-lgs-dates) ──
      - name: Enrich LGS dates
        id: enrich_lgs
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/enrich-lgs-dates.js || [ $? -eq 2 ]

      # Campeonatos por equipas (FFAA…): os cruzamentos de match play depois do
      # stroke play, do mitarjeta → public/data/lgs-matchplay/{id}.json (aba
      # «Match Play» na /rfeg). Precisa das datas do passo anterior.
      - name: Match play LGS (campeonatos por equipas)
        id: lgs_matchplay
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/scrape-lgs-matchplay.js || [ $? -eq 2 ]

      # Federação Valenciana (golfcv.com): calendário + inscritos pela API do
      # site, resultados dos PDFs por categoria (cifrados — ver o cabeçalho do
      # script) → public/data/fgcv/{torneoid}.json (fonte «FGCV» na /rfeg).
      - name: Scrape FGCV (Federação Valenciana)
        id: fgcv
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/scrape-fgcv.js || [ $? -eq 2 ]

      - name: Enrich LGS stats (metros + SI por buraco)
        id: enrich_lgs_stats
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/enrich-lgs-stats.js --concurrency 6 || [ $? -eq 2 ]

      - name: Inferir par NextCaddy (fallback)
        id: infer_par
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/infer-nextcaddy-par.js

      - name: Build rfegolf-resultats-index.json
        timeout-minutes: 10
        run: node scripts/build-rfegolf-index.js

      - name: Build licencia-dob-lookup.json
        timeout-minutes: 10
        run: node scripts/build-licencia-dob-lookup.js

      - name: Build licencia-hcp-lookup.json
        timeout-minutes: 10
        run: node scripts/build-licencia-hcp-lookup.js

      # Os gémeos têm de existir ANTES do rivals: build-rfegolf-rivals.js usa
      # rfegolf-lgs-twins.json para não duplicar torneios RFEGolf↔LGS.
      - name: Build mapa de gémeos RFEGolf<->LGS
        timeout-minutes: 10
        run: node scripts/build-lgs-twins.js

      - name: Build fcg-rivals.json
        timeout-minutes: 10
        run: node scripts/build-fcg-rivals.js

      # ⚠ ORDEM: os torneios por jogador precisam dos gémeos + fcg-rivals, e o
      # spain-players.json precisa DELES (usa os `counts` para a coluna 📊 Tot —
      # o número da tabela tem de ser o nº de linhas do painel expansível).
      - name: Build spain-player-tournaments.json (torneios por jogador)
        timeout-minutes: 10
        run: node scripts/build-spain-player-tournaments.js

      - name: Build spain-players.json
        timeout-minutes: 10
        run: node scripts/build-spain-players-export.js

      - name: Build rfegolf-rivals.json
        timeout-minutes: 10
        run: node scripts/build-rfegolf-rivals.js

      - name: Commit e push (se houver mudanças)
        timeout-minutes: 20
        run: |
          bash scripts/ci/push-generated.sh -m "data: update Espanha (RFEG + LGS + NC + FCG) $(date -u +'%Y-%m-%d %H:%M UTC')" \
            -- public/data/rfegolf-resultats/ public/data/rfegolf-livegolfscoring/ public/data/lgs-matchplay/ public/data/fgcv/ \
               public/data/nextcaddy/ public/data/fcg/ public/data/rfegolf-resultats-index.json \
               public/data/licencia-dob-lookup.json public/data/licencia-hcp-lookup.json \
               public/data/spain-players.json public/data/rfegolf-rivals.json \
               public/data/fcg-rivals.json public/data/spain-player-tournaments.json \
               public/data/rfegolf-lgs-twins.json scripts/fcg-scope.json \
               scripts/nextcaddy-scope-all.json

      # ── Verificação final: falhar ALTO se algum scraper falhou ──
      # Os scrapers correm com continue-on-error para que a falha de um portal
      # não impeça os outros de correr nem o commit dos dados bons. Mas sem
      # este passo, o workflow ficava verde e ninguém recebia email. Corre
      # DEPOIS do commit (dados bons já preservados) e falha se houve falhas.
      - name: Verificar falhas dos scrapers
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.disc_fcg.outcome }}"    = "failure" ] && FAILED="$FAILED discovery-FCG"
          [ "${{ steps.disc_nc.outcome }}"     = "failure" ] && FAILED="$FAILED discovery-NextCaddy"
          [ "${{ steps.rfegolf.outcome }}"     = "failure" ] && FAILED="$FAILED RFEG"
          [ "${{ steps.lgs.outcome }}"         = "failure" ] && FAILED="$FAILED livegolfscoring"
          [ "${{ steps.nextcaddy.outcome }}"   = "failure" ] && FAILED="$FAILED NextCaddy"
          [ "${{ steps.nc_horarios.outcome }}" = "failure" ] && FAILED="$FAILED NextCaddy-horarios"
          [ "${{ steps.nc_scorecards.outcome }}" = "failure" ] && FAILED="$FAILED NextCaddy-scorecards"
          [ "${{ steps.fcg.outcome }}"         = "failure" ] && FAILED="$FAILED FCG"
          [ "${{ steps.enrich_lgs.outcome }}"  = "failure" ] && FAILED="$FAILED enrich-LGS"
          [ "${{ steps.enrich_lgs_stats.outcome }}" = "failure" ] && FAILED="$FAILED enrich-LGS-stats"
          [ "${{ steps.lgs_matchplay.outcome }}" = "failure" ] && FAILED="$FAILED match-play-LGS"
          [ "${{ steps.fgcv.outcome }}" = "failure" ] && FAILED="$FAILED FGCV"
          [ "${{ steps.infer_par.outcome }}"   = "failure" ] && FAILED="$FAILED infer-par-NC"
          # Os builds e o commit não têm continue-on-error: se falharem o job já
          # está vermelho; aqui só se diz qual foi.
          [ "${{ job.status }}" = "failure" ] && FAILED="$FAILED (build/commit — ver passo vermelho)"
          if [ -n "$FAILED" ]; then
            echo "❌ Scrapers falhados:$FAILED"
            echo "Os dados dos scrapers que correram bem JÁ foram commitados."
            echo "Ver os logs dos passos falhados acima para diagnosticar."
            exit 1
          fi
          echo "✓ Todos os scrapers correram sem falhas"
