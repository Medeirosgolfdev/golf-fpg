name: Build MAJOR catalog

# Regenera public/data/major-catalog.json (o índice leve da página /major) sempre
# que um ficheiro de dados MAJOR muda. A página passou a carregar SÓ este catálogo
# no arranque (~50 KB) em vez de ~127 ficheiros (~14.6 MB) — o detalhe de cada
# torneio carrega lazy ao clicar. Ver scripts/build-major-catalog.js.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'public/data/brjgt*.json'
      - 'public/data/eowagr25_contest*.json'
      - 'public/data/ftm_doral_*.json'
      - 'public/data/orangebowl_*.json'
      - 'public/data/ftm_fm_*.json'
      - 'public/data/fsga_*.json'
      - 'public/data/uajt_*.json'
      - 'public/data/uaworlds_*.json'
      - 'public/data/mexnacional_*.json'
      - 'public/data/coc_*.json'
      - 'public/data/reidtrophy_*.json'
      - 'public/data/icopa_*.json'
      - 'public/data/interzonas_*.json'
      - 'public/data/avtrophy_*.json'
      - 'public/data/ebtc2_*.json'
      - 'public/data/egtc_*.json'
      - 'public/data/elg_*.json'
      - 'public/data/eatc_*.json'
      - 'public/data/eatc2_*.json'
      - 'public/data/eym_*.json'
      - 'public/data/ejo_*.json'
      - 'public/data/fcg*.json'
      - 'public/data/jwgc*.json'
      - 'scripts/build-major-catalog.js'
      - '.github/workflows/build-major-catalog.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-major-catalog
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build catalog
        run: node scripts/build-major-catalog.js

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet public/data/major-catalog.json public/data/major-veterans.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Catálogo inalterado"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat public/data/major-catalog.json public/data/major-veterans.json
          fi

      - name: Commit catalog
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/major-catalog.json public/data/major-veterans.json
          git commit -m "build: rebuild MAJOR catalog"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Push OK (tentativa $i)"
              exit 0
            fi
            echo "Push falhou (tentativa $i) — outro workflow fez push, a refazer rebase..."
            sleep 5
          done
          echo "Push falhou após 5 tentativas"
          exit 1
