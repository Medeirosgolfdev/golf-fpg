name: Actualizar EGR

# Refresh do European Golf Rankings (europeangolfrankings.com) — Node-puro, SEM
# secrets (HTML server-side + APIs públicas). Pipeline:
#   1. scrape-egr.js --ranking            → egr-ranking.json (M+F)
#   2. scrape-egr.js --events --skip-existing → egr/events/egr_{id}.json (novos)
#   2b. scrape-egr.js --players --ids-file → egr/players/egr_{id}.json (novas; todas na 1.ª segunda do mês)
#   3. scrape-egr-sources.js              → egr-dob-roster.json (ano nasc./HCP via
#                                           GolfBox, público) + carimba birthYear
#   4. build-egr-events-list.js           → egr/egr-events-list.json (índice sidebar)
# Se algo mudou, regenera os canónicos do kids2 (juniors + shards + catálogo) e
# committa. Push com GITHUB_TOKEN não dispara build-juniors.yml (anti-recursão) →
# o agregador corre AQUI.
on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Re-fetch de TODOS os eventos (ignora --skip-existing)'
        required: false
        default: false
        type: boolean
  schedule:
    # Segunda 06:00 UTC — depois dos eventos de fim-de-semana serem publicados.
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  update-egr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: update-egr
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Scrape EGR (ranking + eventos + roster + índice)
        id: egr
        run: |
          set +e
          SKIP="--skip-existing"
          if [ "${{ github.event.inputs.full_rebuild }}" = "true" ]; then SKIP=""; fi

          # Anos automáticos (o actual e o anterior) — estavam fixos em 2025/2026.
          Y=$(date -u +%Y); P=$((Y - 1))
          # Nenhum passo trava os outros nem o commit (exit 2 = sem novidades),
          # mas uma falha real fica registada e o job acaba vermelho no fim.
          FAILED=""
          node() { command node "$@"; local rc=$?; if [ $rc != 0 ] && [ $rc != 2 ]; then echo "::error::node $* → exit $rc"; FAILED="$FAILED $(basename "$1" .js)"; fi; return 0; }
          echo "▸ ranking";        node scripts/scrape-egr.js --ranking
          echo "▸ eventos";        node scripts/scrape-egr.js --events --year $P --year $Y $SKIP
          # Fichas de jogador (a ficha só mostra ~2 anos; a gravação é ADITIVA —
          # scripts/lib/merge-aditivo.js — por isso o que já temos nunca se perde).
          # Todas as semanas: fichas novas. 1.ª segunda do mês: refrescar todas,
          # para nenhum torneio chegar aos 2 anos sem ter sido guardado.
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/egr-ids.txt",Object.keys(JSON.parse(fs.readFileSync("public/data/egr/egr-player-events.json")).players).join(","))'
          if [ "$(date -u +%d)" -le 7 ]; then PSKIP=""; else PSKIP="--skip-existing"; fi
          echo "▸ fichas de jogador ${PSKIP:-(todas)}"; node scripts/scrape-egr.js --players --ids-file /tmp/egr-ids.txt --concurrency 3 $PSKIP
          echo "▸ roster GolfBox"; node scripts/scrape-egr-sources.js
          echo "▸ índice eventos"; node scripts/build-egr-events-list.js
          echo "▸ rank slim";      node scripts/build-egr-rank-slim.js
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          exit 0

      - name: Detectar alterações EGR
        id: diff
        run: |
          if git diff --quiet -- public/data/egr public/data/egr-ranking.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Sem alterações EGR — a saltar rebuild e commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Regenerar juniores canónicos (agregador)
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/aggregator/index.js

      - name: Commit e push (se houve alterações)
        if: steps.diff.outputs.changed == 'true'
        run: |
          bash scripts/ci/push-generated.sh -m "data: EGR refresh + rebuild juniors $(date +'%Y-%m-%d %H:%M')" \
            -f agregador -- public/data

      - name: Falhar se algum passo do EGR falhou
        if: always() && steps.egr.outputs.failed != ''
        run: |
          echo "❌ Falharam:${{ steps.egr.outputs.failed }} — o que correu bem já foi publicado."
          exit 1
