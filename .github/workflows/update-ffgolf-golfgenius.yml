name: Actualizar FFGolf — GolfGenius (Playwright)

# Corre:
#   - Automaticamente Segunda-feira às 03:00 UTC (madrugada Lisboa)
#   - A pedido (botão "Run workflow" no GitHub)
#
# Scrape de torneios juvenis FFG hospedados em GolfGenius (Championnats de
# France, Internationaux U14/U18, etc.). Catálogo em public/data/ffgolf-catalog.json.
#
# Usa Playwright (chromium) headless porque o GolfGenius depende de JS para
# carregar dropdowns de eventos e scorecards.
#
# Default do cron: --year <ano corrente> (sem --slug → todos os torneios do
# catálogo nesse ano). Para correr 1 torneio específico ou re-scrape histórico,
# usar workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Ano a scrapar (ex: 2026). Vazio = ano corrente.'
        required: false
        default: ''
      slug:
        description: 'Slug específico de torneio (ex: "internationaux-de-france-u14-garcons-2025"). Vazio = todos do ano.'
        required: false
        default: ''
      gg_page:
        description: 'GG page ID ad-hoc (ex: "11842510449344033466"). Requer também --slug e --year.'
        required: false
        default: ''

  schedule:
    # Segunda 03:00 UTC ≈ 03:00 Lisboa (inverno) / 04:00 (BST verão)
    # 1h depois do update-ffgolf-resultats.yml para evitar colisões no git push.
    - cron: '0 3 * * 1'

permissions:
  contents: write

# Uma corrida de cada vez deste workflow: a seguinte espera (não cancela a
# que está a correr). Entre workflows diferentes quem resolve é o
# scripts/ci/push-generated.sh — ver docs/claude/workflows.md, «Push dos dados».
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-ffgolf-golfgenius:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Descobrir torneios novos no catálogo (ffgolf.org)
        # Sem isto, o scrape só cobre slugs já conhecidos — torneios GG novos
        # nunca entravam sozinhos. O merge é cron-safe (preserva anos antigos).
        # continue-on-error: se o ffgolf.org mudar/bloquear, o scrape continua
        # com o catálogo existente.
        continue-on-error: true
        run: |
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then YEAR=$(date -u +%Y); fi
          node scripts/discover-ffgolf-catalog.js --year "$YEAR" --headless

      - name: Correr scrape-ffgolf.js
        id: scrape
        run: |
          ARGS="--headless"
          # Year: input do workflow_dispatch ou ano corrente
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          else
            CURRENT_YEAR=$(date -u +%Y)
            ARGS="$ARGS --year $CURRENT_YEAR"
            echo "ℹ️  Default: ano corrente $CURRENT_YEAR"
          fi
          # Slug específico (opcional)
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi
          # GG page ad-hoc (opcional, requer slug + year)
          if [ -n "${{ github.event.inputs.gg_page }}" ]; then
            ARGS="$ARGS --gg-page ${{ github.event.inputs.gg_page }}"
          fi
          echo "Args: $ARGS"
          node scripts/scrape-ffgolf.js $ARGS

      - name: Rota fetch p/ torneios sem leaderboard no iframe
        # Alguns torneios (Internationaux U14, Grand Prix National U12…) embebem o
        # widget `next_round` em vez do leaderboard → o scrape-ffgolf.js (Playwright)
        # devolve 0 jogadores. Esta rota vai directa ao `tournament_results` da league
        # por `fetch` puro. Só toca nos slugs que ficaram sem ficheiro/vazios.
        # Exit code 2 = nada novo (não é erro).
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="--year ${{ github.event.inputs.year }}"
          else
            ARGS="--year $(date -u +%Y)"
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi
          echo "Args: $ARGS"
          set +e
          node scripts/scrape-ffgolf-gg-fetch.js $ARGS
          RC=$?
          set -e
          if [ "$RC" = "1" ]; then exit 1; fi
          echo "gg-fetch rc=$RC"

      - name: Regenerar roster FR (contagens GG + gémeos)
        # Os torneios GG contam para o france-players.json via matching de nome
        # (lib/ffgolf-gg.js); gémeos do portal resultats são deduplicados em
        # ffgolf-gg-twins.json. O push do france-players.json dispara o
        # build-juniors.yml (kids2).
        run: node scripts/build-france-players.js

      - name: Commit e push (se houver mudanças)
        run: |
          bash scripts/ci/push-generated.sh -m "data: update FFGolf GolfGenius $(date -u +'%Y-%m-%d %H:%M UTC')" \
            -f ffgolf -- public/data/ffgolf/ public/data/ffgolf-catalog.json
