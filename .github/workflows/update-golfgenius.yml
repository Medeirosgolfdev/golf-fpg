name: Actualizar GolfGenius

# Scraper genérico de eventos GolfGenius (Node puro — o GG devolve 403 a browsers
# automatizados mas responde a `fetch`). Lê scripts/golfgenius-scope.json e
# reescreve os JobFiles em public/data/{slug}_{ano}.json. Se algum mudou,
# regenera de seguida os canónicos do kids2 (juniors.json + shards) e o
# catálogo MAJOR.
#
# ⚠ O cron só corre as entradas SEM `disabled: true` — as edições encerradas
# ficam disabled porque o scraper re-fetcha todos os scorecards em cada run
# (o cron de 2026-08-06 estourou o timeout de 90 min com o scope todo activo:
# ~85 min de scrape e o commit ficou por fazer — a R3 do Reid Trophy não foi
# publicada). Para re-scrapar uma edição encerrada: dispatch com o `slug`
# (o --slug explícito INCLUI as entradas disabled).
#
# GolfGenius público → SEM secrets/cookies.
#
# Corre:
#  - Cron diário às 22:00 UTC — apanha o fim de cada dia de prova (o Champion of
#    Champions joga-se em Julho na Irlanda do Norte, UTC+1). Sem alterações →
#    exit 2 → sem commit.
#  - A pedido, opcionalmente restringindo a um slug do scope ou dando uma URL
#    ad-hoc de uma página /pages/{id}.
#
# Nota: o commit é self-contained (scrape + agregador + catálogo) porque um push
# feito com GITHUB_TOKEN não dispara os workflows build-juniors/build-major-catalog.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Correr só este slug do scope, incluindo entradas disabled (vazio = todas as activas)'
        required: false
        default: ''
        type: string
      page_url:
        description: 'URL /pages/{id} ad-hoc (ignora o scope)'
        required: false
        default: ''
        type: string
  schedule:
    # Minuto Hora Dia Mês DiaSemana (UTC)
    - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  update-golfgenius:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: update-golfgenius
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-golfgenius-node.js
        id: scrape
        run: |
          set +e
          URL="${{ github.event.inputs.page_url }}"
          SLUG="${{ github.event.inputs.slug }}"
          if [ -n "$URL" ]; then
            node scripts/scrape-golfgenius-node.js "$URL"
          elif [ -n "$SLUG" ]; then
            node scripts/scrape-golfgenius-node.js --scope scripts/golfgenius-scope.json --slug "$SLUG"
          else
            node scripts/scrape-golfgenius-node.js --scope scripts/golfgenius-scope.json
          fi
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = houve novidades → regenerar canónico + commit
          # 2 = sem alterações → no-op (NÃO é erro)
          # 1 = erro real
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper GolfGenius falhou — ver logs acima"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem alterações — a saltar regeneração e commit"
          fi
          exit 0

      - name: Regenerar juniores canónicos (agregador)
        if: steps.scrape.outputs.exit_code == '0'
        run: node scripts/aggregator/index.js

      - name: Regenerar catálogo MAJOR
        if: steps.scrape.outputs.exit_code == '0'
        run: node scripts/build-major-catalog.js

      - name: Commit e push (se houve alterações)
        if: steps.scrape.outputs.exit_code == '0'
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: GolfGenius scrape + rebuild juniors ${DATE}"

          # Ficheiros GERADOS (não-fonte). Um push concorrente (build-juniors,
          # outro update-*) regenera-os no mesmo instante → o rebase entra em
          # conflito. Fundir à mão só produz JSON inválido; a política do repo
          # (ver CLAUDE.md "Conflitos de git nos ficheiros GERADOS") é REGENERAR.
          # Por isso: se os ÚNICOS conflitos forem estes, aceitamos qualquer lado
          # (é indiferente — regeneramos logo a seguir), continuamos o rebase e
          # reconstruímos os agregados a partir da árvore já fundida.
          GEN_FILES="public/data/major-catalog.json public/data/juniors.json public/data/juniors-tournaments.json public/data/tournament-catalog.json"

          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"

            git rebase "origin/${GITHUB_REF_NAME}"
            if [ $? -ne 0 ]; then
              # Só resolvemos automaticamente se TODOS os conflitos forem gerados
              CONFLICTED=$(git diff --name-only --diff-filter=U)
              UNEXPECTED=$(printf '%s\n' $CONFLICTED | grep -vxF -f <(printf '%s\n' $GEN_FILES))
              if [ -n "$UNEXPECTED" ]; then
                echo "Conflito inesperado em ficheiros não-gerados:"
                echo "$UNEXPECTED"
                git rebase --abort 2>/dev/null || true
                echo "❌ Rebase com conflitos que não sabemos resolver automaticamente"
                exit 1
              fi
              git checkout --theirs -- $CONFLICTED
              git add -- $CONFLICTED
              GIT_EDITOR=true git rebase --continue
              if [ $? -ne 0 ]; then
                git rebase --abort 2>/dev/null || true
                echo "Rebase --continue falhou — retry em $((i * 5))s"
                sleep $((i * 5))
                continue
              fi
              # Reconstruir os agregados com os JobFiles novos + as alterações remotas
              node scripts/aggregator/index.js || { echo "❌ agregador falhou"; exit 1; }
              node scripts/build-major-catalog.js || { echo "❌ build-major-catalog falhou"; exit 1; }
              git add public/data
              git diff --staged --quiet || git commit --amend --no-edit
            fi

            if git push; then
              PUSH_OK=1
              break
            fi
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ GolfGenius + juniores canónicos actualizados"
