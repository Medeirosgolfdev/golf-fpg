name: Scrape torneios juvenis a pedido (Miramar / McGinley)

# Re-scrapa a PEDIDO os resultados de torneios juvenis que decorrem em vários
# dias, para correr quando cada ronda acaba. Escreve os ficheiros standalone
# que a FPGPage carrega via EXTRA_TOURN_FILES (public/data/torneio-{ccode}-{tcode}.json):
#
#   003/10652  Miramar Internacional Open U25 2026 (U25, 54 buracos)   [terminado]
#   003/10653  Miramar Internacional Open U25 2026 (Sub-10, 27 buracos) [terminado]
#   962/10082  Paul McGinley Junior Cup 2026 — U18 & U16 (2 rondas)
#   962/10083  Paul McGinley Junior Cup 2026 — U14      (2 rondas)
#   962/10084  Paul McGinley Junior Cup 2026 — U12      (2 rondas)
#
# Fonte: scoring.datagolf.pt/pt/Classifications.aspx?ccode=CCC&tcode=NNNNN via
# scripts/scrape-classif-node.js (Node puro, warmup linkpage + ClassifLST +
# ScoreCard). Merge ADITIVO: re-correr a meio de uma ronda nunca apaga buracos
# já guardados; posição/total/±par vêm sempre do scrape novo. Torneios já
# terminados que se re-scrapem não mudam → não geram commit.
#
# Só faz commit se algum ficheiro mudou (ex: a R2 acabou → novos totais).
#
# Requer GitHub Secret: DATAGOLF_SCORING_COOKIES (cookie header de
# scoring.datagolf.pt — os mesmos do update-classif/update-drive).
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Pares ccode:tcode a scrapar (CSV). Default = Miramar + McGinley 2026.'
        required: false
        default: '003:10652,003:10653,962:10082,962:10083,962:10084'
      force_commit:
        description: 'Commit mesmo sem mudanças?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Scrapar cada par ccode:tcode para o seu ficheiro standalone
        id: scrape
        run: |
          set +e
          PAIRS="${{ github.event.inputs.pairs || '003:10652,003:10653,962:10082,962:10083,962:10084' }}"
          ANY_OK=0
          ANY_ERR=0
          FILES=""
          IFS=',' read -ra ARR <<< "$PAIRS"
          for PAIR in "${ARR[@]}"; do
            PAIR="$(echo "$PAIR" | tr -d '[:space:]')"
            [ -z "$PAIR" ] && continue
            CCODE="${PAIR%%:*}"
            TC="${PAIR##*:}"
            [ -z "$CCODE" ] || [ -z "$TC" ] || [ "$CCODE" = "$TC" ] && { echo "⚠ par inválido: $PAIR (usar ccode:tcode)"; continue; }
            OUT="public/data/torneio-${CCODE}-${TC}.json"
            echo "── Scrape ${CCODE}/${TC} → ${OUT}"
            node scripts/scrape-classif-node.js --tclub "$CCODE" --tcode "$TC" --out "$OUT"
            EC=$?
            echo "  exit=$EC"
            if [ "$EC" = "1" ]; then ANY_ERR=1; fi
            if [ "$EC" = "0" ]; then ANY_OK=1; fi
            [ -f "$OUT" ] && FILES="$FILES $OUT"
          done
          echo "any_ok=$ANY_OK" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT
          if [ "$ANY_ERR" = "1" ] && [ "$ANY_OK" = "0" ]; then
            echo "❌ Todos os scrapes falharam"
            exit 1
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      # O scraper regenera o ficheiro do zero e os jogadores "Internacional"
      # (sem federado FPG) vêm sem dob/sexo → sem escalão. Este passo volta a
      # anexar a ficha RFEG (_rfeg com dob/sexo) por nome, senão os espanhóis
      # do Miramar ficam sem escalão nos resultados a cada re-scrape.
      - name: Enriquecer internacionais (ficha RFEG)
        if: steps.scrape.outputs.files != ''
        run: node scripts/enrich-intl-players.js ${{ steps.scrape.outputs.files }} || echo "enrich falhou (não aborta)"

      - name: Validar ficheiros
        run: |
          FILES="${{ steps.scrape.outputs.files }}"
          [ -n "$FILES" ] && node scripts/validate-data.js $FILES || echo "Sem ficheiros para validar"

      - name: Commit e push (se houver mudanças)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/torneio-*.json

          if git diff --staged --quiet && [ "${{ github.event.inputs.force_commit }}" != "true" ]; then
            echo "Nenhuma alteração — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: resultados torneios juvenis ${DATE}" || { echo "Nada para commitar"; exit 0; }

          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; sleep $((i * 5)); continue; }
            if git push; then echo "✓ push ok"; exit 0; fi
            echo "Push tentativa $i falhou — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          echo "❌ Push falhou após 5 tentativas"
          exit 1
