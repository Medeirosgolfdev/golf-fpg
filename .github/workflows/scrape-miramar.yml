name: Scrape de torneios FPG a pedido (ccode:tcode)

# Re-scrapa a PEDIDO os resultados de um ou mais torneios FPG, indicados como
# pares `ccode:tcode`. Feita para torneios de vários dias: corre-se no fim de
# cada ronda, enquanto a prova decorre. Escreve os ficheiros standalone que a
# FPGPage carrega via EXTRA_TOURN_FILES (public/data/torneio-{ccode}-{tcode}.json).
#
# NÃO tem defaults de propósito (2026-08-29). Nasceu a 23/08 com os cinco
# torneios de Agosto no `pairs` — Miramar (003/10652+10653) e Paul McGinley
# (962/10082+83+84) — mas todos já tinham acabado nessa data, por isso nunca
# chegou a correr e o default só servia para re-scrapar provas terminadas.
# Sem pares, a corrida não faz nada e sai verde: diz-se-lhe o que scrapar.
#
# Os ficheiros dessas provas continuam no repo e servidos ao site — e o
# 912/10225 (Camp. Nacional de Profissionais) também, apesar de nunca ter
# estado no default. Para refrescar qualquer um deles, basta passar o par.
#
# Uso: Actions → esta workflow → Run workflow → pairs: "962:10082,962:10083"
#
# Fonte: scoring.datagolf.pt/pt/Classifications.aspx?ccode=CCC&tcode=NNNNN via
# scripts/scrape-classif-node.js (Node puro, warmup linkpage + ClassifLST +
# ScoreCard). Merge ADITIVO: re-correr a meio de uma ronda nunca apaga buracos
# já guardados; posição/total/±par vêm sempre do scrape novo. Torneios já
# terminados que se re-scrapem não mudam → não geram commit.
#
# Só faz commit se algum ficheiro mudou (ex: a R2 acabou → novos totais).
#
# Requer GitHub Secret: DATAGOLF_SCORING_COOKIES (cookie header de
# scoring.datagolf.pt — os mesmos do update-classif/update-drive).
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'Pares ccode:tcode a scrapar, separados por vírgula. Ex: 962:10082,962:10083'
        required: false
        default: ''
      force_commit:
        description: 'Commit mesmo sem mudanças?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Scrapar cada par ccode:tcode para o seu ficheiro standalone
        id: scrape
        run: |
          set +e
          PAIRS="${{ github.event.inputs.pairs }}"
          # Sem pares não há nada a fazer. Sai verde (não é avaria — é um
          # dispatch sem argumentos), mas diz-se porquê no resumo do run, para
          # não parecer que correu e não fez nada por avaria.
          if [ -z "$(echo "$PAIRS" | tr -d '[:space:],')" ]; then
            echo "Nenhum par ccode:tcode indicado — nada a scrapar."
            echo "Indica os torneios no campo 'pairs', ex: 962:10082,962:10083" 
            {
              echo "### Nada a scrapar"
              echo ""
              echo "Esta workflow corre a pedido e não tem torneios por defeito."
              echo "Volta a disparar preenchendo \`pairs\`, ex: \`962:10082,962:10083\`."
            } >> $GITHUB_STEP_SUMMARY
            echo "any_ok=0" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi
          ANY_OK=0
          ANY_ERR=0
          FILES=""
          IFS=',' read -ra ARR <<< "$PAIRS"
          for PAIR in "${ARR[@]}"; do
            PAIR="$(echo "$PAIR" | tr -d '[:space:]')"
            [ -z "$PAIR" ] && continue
            CCODE="${PAIR%%:*}"
            TC="${PAIR##*:}"
            [ -z "$CCODE" ] || [ -z "$TC" ] || [ "$CCODE" = "$TC" ] && { echo "⚠ par inválido: $PAIR (usar ccode:tcode)"; continue; }
            OUT="public/data/torneio-${CCODE}-${TC}.json"
            echo "── Scrape ${CCODE}/${TC} → ${OUT}"
            node scripts/scrape-classif-node.js --tclub "$CCODE" --tcode "$TC" --out "$OUT"
            EC=$?
            echo "  exit=$EC"
            if [ "$EC" = "1" ]; then ANY_ERR=1; fi
            if [ "$EC" = "0" ]; then ANY_OK=1; fi
            [ -f "$OUT" ] && FILES="$FILES $OUT"
          done
          echo "any_ok=$ANY_OK" >> $GITHUB_OUTPUT
          echo "files=$FILES" >> $GITHUB_OUTPUT
          if [ "$ANY_ERR" = "1" ] && [ "$ANY_OK" = "0" ]; then
            echo "❌ Todos os scrapes falharam"
            exit 1
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      # O scraper regenera o ficheiro do zero e os jogadores "Internacional"
      # (sem federado FPG) vêm sem dob/sexo → sem escalão. Este passo volta a
      # anexar a ficha RFEG (_rfeg com dob/sexo) por nome, senão os espanhóis
      # do Miramar ficam sem escalão nos resultados a cada re-scrape.
      - name: Enriquecer internacionais (ficha RFEG)
        if: steps.scrape.outputs.files != ''
        run: node scripts/enrich-intl-players.js ${{ steps.scrape.outputs.files }} || echo "enrich falhou (não aborta)"

      - name: Validar ficheiros
        run: |
          FILES="${{ steps.scrape.outputs.files }}"
          [ -n "$FILES" ] && node scripts/validate-data.js $FILES || echo "Sem ficheiros para validar"

      - name: Commit e push (se houver mudanças)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/torneio-*.json

          if git diff --staged --quiet && [ "${{ github.event.inputs.force_commit }}" != "true" ]; then
            echo "Nenhuma alteração — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: resultados torneios juvenis ${DATE}" || { echo "Nada para commitar"; exit 0; }

          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; sleep $((i * 5)); continue; }
            if git push; then echo "✓ push ok"; exit 0; fi
            echo "Push tentativa $i falhou — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          echo "❌ Push falhou após 5 tentativas"
          exit 1
