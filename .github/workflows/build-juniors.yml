name: Build juniors canonical

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'public/data/uskids-*.json'
      - 'public/data/uskids_torneios_completos*.json'
      - 'public/data/t_de_tournaments_do_uskids.json'
      - 'public/data/players.json'
      - 'public/data/hcp-listas/**'
      - 'public/data/pull-torneios*.json'
      - 'public/data/drive-data-*.json'
      - 'public/data/aquapor-data-*.json'
      - 'public/data/spain-players.json'
      - 'public/data/rfegolf-rivals.json'
      - 'public/data/fcg-rivals.json'
      - 'public/data/england_*.json'
      - 'public/data/gjgl/**'
      - 'public/data/france-players.json'
      - 'public/data/ffgolf-juniors-slim.json'
      - 'public/data/ffgolf-resultats-index.json'
      - 'public/data/wjgc_*.json'
      - 'public/data/bjgt_*.json'
      - 'public/data/brjgt*.json'
      - 'public/data/fcg[0-9]*_*.json'
      - 'public/data/jwgc[0-9]*_*.json'
      - 'public/data/eowagr*.json'
      - 'public/data/ftm_doral_*.json'
      - 'public/data/ftm_fm_*.json'
      - 'public/data/fsga_*.json'
      - 'public/data/uajt_*.json'
      - 'public/data/uaworlds_*.json'
      - 'public/data/mexnacional_*.json'
      - 'public/data/coc_*.json'
      - 'public/data/reidtrophy_*.json'
      - 'public/data/evianjc_*.json'
      - 'public/data/faldomadeira_*.json'
      - 'public/data/optimist*_*.json'
      - 'public/data/dgv_*.json'
      - 'public/data/icopa_*.json'
      - 'public/data/interzonas_*.json'
      - 'public/data/avtrophy_*.json'
      - 'public/data/orangebowl_*.json'
      - 'public/data/ebtc2_*.json'
      - 'public/data/egtc_*.json'
      - 'public/data/elg_*.json'
      - 'public/data/eatc_*.json'
      - 'public/data/eatc2_*.json'
      - 'public/data/eym_*.json'
      - 'public/data/ejo_*.json'
      - 'public/data/ejt*.json'
      - 'public/data/egr/egr-events-list.json'
      - 'public/data/egr/egr-dob-roster.json'
      - 'public/data/egr/events/**'
      - 'public/data/egr/players/**'
      # WAGR só enriquece (util/wagr-enrich.js) — sai à quarta.
      - 'public/data/wagr/wagr-events-list.json'
      - 'public/data/wagr/events/**'
      - 'public/data/juniors-overrides.json'
      - 'scripts/aggregator/**'
      - '.github/workflows/build-juniors.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: build-juniors
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run aggregator
        id: run
        run: |
          node scripts/aggregator/index.js
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet public/data/juniors.json 'public/data/juniors-tournaments*.json' public/data/tournament-catalog.json public/data/juniors-form.json public/data/juniors-scout.json public/data/juniors-links.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Sem mudanças nos outputs canónicos"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat public/data/juniors.json 'public/data/juniors-tournaments*.json' public/data/tournament-catalog.json public/data/juniors-form.json public/data/juniors-scout.json public/data/juniors-links.json
          fi

      - name: Commit outputs
        if: steps.diff.outputs.changed == 'true'
        # -f agregador: se o main avançar, os agregados são REGENERADOS por cima
        # dele (nunca fundidos) — ver scripts/ci/push-generated.sh.
        run: |
          bash scripts/ci/push-generated.sh -m "build: rebuild juniors canonical" -f agregador --
