name: Actualizar Federados

# Refresh COMPLETO de public/data/federados.json (~15.600 activos, FedStat=9)
# via scripts/scrape-federados-node.js (Node puro, sem browser).
#
# Corre:
#  - PRIMÁRIO (cascata): disparado por scripts/run-cookie-refresh.bat logo
#    após o refresh diário de cookies às Quartas (gh workflow run). Garante
#    que a Action corre com cookies de segundos — nunca falha por timing.
#  - FALLBACK: cron à Quarta às 20:00 UTC, para o caso de o PC estar
#    desligado de manhã e só refrescar os cookies à tarde. Corre DEPOIS da
#    janela de refresh (manhã/início de tarde), nunca antes. Se a cascata já
#    correu nesse dia, este run só confirma "sem alterações" (exit 2, no-op).
#  - A pedido (botão "Run workflow" no GitHub)
#
# Útil para apanhar: novas fotos de jogadores (paths antigos passam a 404),
# novos federados, mudanças de clube/HCP.
#
# Requer GitHub Secret:
#   DATAGOLF_SCORING_COOKIES — cookie header capturado de scoring.datagolf.pt
#                              formato: "ASP.NET_SessionId=XXX; DG_Lists_URL=YYY"
#   (o mesmo secret usado por update-drive / update-jovens / update-classif)
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Só comparar, sem gravar (--check-only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force_commit:
        description: 'Fazer commit mesmo se nada mudou?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    # Minuto Hora Dia Mês DiaSemana (UTC) — 17:00 UTC à Quarta (3).
    # FALLBACK tardio: corre depois da janela do refresh diário de cookies
    # (que acontece de manhã/início de tarde local). O trigger primário é a
    # cascata em scripts/run-cookie-refresh.bat. NÃO voltar a pôr de manhã
    # (05:00 UTC corria ANTES do refresh → cookies de ~46h → HTTP 500).
    # NÃO voltar a pôr às 20:00: com o delay do GitHub o run caía ~21-22h UTC
    # e o scoring.datagolf.pt devolve HTTP 500 sistemático nessa janela
    # nocturna — 7/7 runs agendados falharam (17 Jun a 29 Jul 2026), com os
    # MESMOS cookies a funcionar de manhã/tarde no mesmo dia. 17:00 UTC
    # (18:00 Lisboa) fica depois do refresh e fora da janela má.
    - cron: '0 17 * * 3'

permissions:
  contents: write
  issues: write   # resumo por email de cada run (issue → notificação do GitHub)

jobs:
  update-federados:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Correr scrape-federados-node.js
        id: scrape
        run: |
          set +e
          CHECK_ONLY=""
          if [ "${{ github.event.inputs.check_only }}" = "true" ]; then
            CHECK_ONLY="--check-only"
          fi
          node scripts/scrape-federados-node.js $CHECK_ONLY
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = ficheiro actualizado → commit
          # 2 = sem alterações → não commit (NÃO é erro)
          # 1 = erro real (cookies expirados, run parcial, etc.)
          if [ "$EXIT_CODE" = "1" ]; then
            echo "❌ Scraper falhou — ver logs acima (provável cookies expirados)"
            exit 1
          fi
          if [ "$EXIT_CODE" = "2" ]; then
            echo "ℹ️  Sem alterações reais — a saltar o commit"
          fi
          exit 0
        env:
          DATAGOLF_SCORING_COOKIES: ${{ secrets.DATAGOLF_SCORING_COOKIES }}

      # ── Resumo por email deste run ─────────────────────────────────────
      # Corre ANTES do commit de propósito: o resumo lê o diff da ÁRVORE DE
      # TRABALHO (federados.json novo vs. o do HEAD), que é exactamente o que
      # este run produziu. Depois do commit o `git pull --rebase` do push traz
      # commits de outros workflows e o diff deixaria de ser só nosso.
      # `--only-players` limita o âmbito aos nossos federados + cadastro FPG
      # (o bloco do federados.json corre antes desse filtro) — aqui não há mais
      # nada a mudar, mas evita apanhar lixo se um dia houver.
      # Nunca falha o workflow: os scripts engolem os próprios erros e o passo
      # é continue-on-error — os dados é que interessam, o email é extra.
      - name: Resumo por email (quem entrou/saiu do cadastro)
        if: steps.scrape.outputs.exit_code == '0' && github.event.inputs.check_only != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/build-run-digest.js \
            --source cadastro \
            --only-players \
            --out /tmp/digest-cadastro.json
          if [ -f /tmp/digest-cadastro.json ]; then
            node scripts/send-digest-issue.js \
              --file /tmp/digest-cadastro.json \
              --title "🪪 Federados — $(date -u +'%Y-%m-%d %H:%M') UTC"
          else
            echo "ℹ️  Sem entradas/saídas no cadastro — sem email."
          fi

      - name: Commit e push (se houve alterações)
        if: steps.scrape.outputs.exit_code == '0' && github.event.inputs.check_only != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/federados.json

          # Dupla verificação: só commitar se o git diff mostra alterações
          if git diff --staged --quiet; then
            echo "Nenhuma alteração em staging — sem commit."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d %H:%M')
          git commit -m "data: refresh federados.json ${DATE}"
          # Push robusto: retry com pull --rebase em cada tentativa.
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push; then
              PUSH_OK=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push tentativa $i falhou (provável push concorrente) — retry em $((i * 5))s"
            sleep $((i * 5))
          done
          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push falhou após 5 tentativas"
            exit 1
          fi
          echo "✓ federados.json actualizado"
