    <script type="text/javascript">

        $(document).ready(function () {

            //Prepare jtable plugin
            $('#ClassifATableContainer').jtable({
                messages: messagespt,
                title: 'Ranking Drive Challege Madeira - Sub 12 Gross',
                //paging: false,
                sorting: false,
                paging: true,
                pageSize: 100,
                sorting: true,
                //defaultSorting: 'id ASC',
                actions: {
                    listAction: 'rankings_classif.aspx/RankingsClassifLST?Club=' + $("#lblClub").text() + '&Rk_Code=' + $("#lblRkCode").text()
                },
               
                fields: {
                    id: {
                        key: true,
                        create: false,
                        edit: false,
                        list: false
                    },
                    rk_pos: {
                        title: "<div class=\"alncenter\">" + 'Pos' + "</div>",
                        width: '5%',
                        sorting: false,
                        display: function (data) {
                            var a = "";
                            var b = data.record.classif_status;
                            if (b == "0") { a = '<div class="alncenter">' + data.record.rk_pos + '</div>'; }
                            else { a = '<div class="alncenter">' + ' - ' + '</div>'; }
                            return a;
                        }
                    },

                    Player: {
                        title: 'Nome',
                        width: '25%',
                        sorting: false,
                        edit: false,
                        create: false,

                        display: function (federData) {
                            //Create an image that will be used to open child table
                            //var $img = $('<img class="child-opener-image" src="Content/images/Misc/Sinalmais.png" title="Consultar Detalhe Jogador" />');
                            var $img = $('<h6 class="child-opener-image" >' + federData.record.name + '</h6>');

                            //Open child table when user clicks the image
                            $img.click(function () {
                                $('#ClassifATableContainer').jtable('openChildTable',
                                    $img.closest('tr'),
                                    {
                                        messages: messagespt,
                                        title: federData.record.name + ' ',
                                        actions: {
                                            listAction: 'rankings_classif.aspx/RankingsPlayersLST?Club=' + $("#lblClub").text() + '&Rk_Code=' + $("#lblRkCode").text() + '&fed_code=' + federData.record.federated_code
                                        },
                                        fields: {
                                            tourn_date: {
                                                title: "<div class=\"alncenter\">" + 'Data' + "</div>",
                                                width: '15%',
                                                type: 'date',
                                                display: function (data) {
                                                    return "<div class=\"alncenter nowrap\">" + moment(data.record.tourn_date).format('YYYY-MM-DD') + "</div>";
                                                }                        //displayFormat: 'yy-mm-dd'
                                            },
                                            tournament_desc: {
                                                title: 'Torneio',
                                                width: '40%',
                                                sorting: false,
                                                edit: false,
                                                create: false,
                                            },
                                            rk_pos: {
                                                title: "<div class=\"alncenter\">" + 'Pos' + "</div>",
                                                width: '10%',
                                                sorting: false,
                                                edit: false,
                                                create: false,
                                                display: function (data) {
                                                    return "<div class=\"alncenter nowrap\">" + data.record.rk_pos + "</div>";
                                                }
                                            },
                                            rank_points: {
                                                title: "<div class=\"alncenter\">" + 'Pontos' + "</div>",
                                                width: '10%',
                                                sorting: false,
                                                edit: false,
                                                create: false,
                                                display: function (data) {
                                                    var a = "";
                                                    var b = data.record.rk_type;
                                                    if (b == "8" || b == "9")
                                                    {
                                                        if (data.record.rank_points > 0) { a = '<div class="alncenter"> +' + data.record.rank_points + '</div>';}
                                                        else if (data.record.rank_points == 0) {a = '<div class="alncenter">PAR</div>';}
                                                        else { a = '<div class="alncenter">' + data.record.rank_points + '</div>' };
                                                    }
                                                    else { a = '<div class="alncenter">' + data.record.rank_points + '</div>'; }
                                                    return a;
                                                }
                                            },
                                        }
                                    }, function (data) { //opened handler
                                        data.childTable.jtable('load');
                                    });
                                });
                                //Return image to show on the person row
                                return $img;
                                }
                            },
                    acronym: {
                        title: 'Clube',
                        width: '25%',
                        sorting: false,
                    },
                    points_real: {
                        title: "<div class=\"alncenter\">" + 'Total' + "</div>",
                        width: '8%',
                        sorting: false,
                        display: function (data) {
                            var a = "";
                            var b = data.record.rk_type;
                            if (b == "8" || b == "9")
                            {
                                if (data.record.points_real > 0) { a = '<div class="alncenter"> +' + data.record.points_real + '</div>';}
                                else if (data.record.points_real == 0) {a = '<div class="alncenter">PAR</div>';}
                                else { a = '<div class="alncenter">' + data.record.points_real + '</div>' };
                            }
                            else { a = '<div class="alncenter">' + data.record.points_real + '</div>'; }
                            return a;
                        }
                    },
                    num_val: {
                        title: "<div class=\"alncenter\">" + 'No. Torneios' + "</div>",
                        width: '8%',
                        sorting: false,
                        display: function (data) {
                            var a = "";
                            var b = data.record.rk_type;
                            if (data.record.numtourn > data.record.num_val) {a = '<div class="alncenter">' + data.record.num_val + ' (' + data.record.numtourn + ')</div>';}
                            else { a = '<div class="alncenter">' + data.record.num_val + '</div>'; }
                            return a;
                        }
                    },
                }
            });

            //Load results list from server
            $('#ClassifATableContainer').jtable('load');

        });

    </script>
