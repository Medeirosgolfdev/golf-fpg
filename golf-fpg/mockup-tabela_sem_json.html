/* ── Normalização de nomes: "SOBRENOME,Nome" → "Nome Sobrenome" ── */
function formatPlayerName(raw) {
  if (!raw) return raw;
  const ci = raw.indexOf(",");
  if (ci > 0) {
    const last  = raw.substring(0, ci).trim();
    const first = raw.substring(ci + 1).trim();
    const cap = s => s.split(" ").map((w, i) => {
      const lo = w.toLowerCase();
      if (i > 0 && ["de","da","do","das","dos","e","van","von"].includes(lo)) return lo;
      return lo.charAt(0).toUpperCase() + lo.slice(1);
    }).join(" ");
    return `${cap(first)} ${cap(last)}`.trim();
  }
  return raw;
}

/* ── Agrupamento de rondas ── */
function extractBaseName(name) {
  return name.replace(/\s*[-–]?\s*(?:dia|round|ronda)\s*\d+\s*$/i, "").trim();
}
function detectRoundNumber(name) {
  const m = name.match(/[-–]?\s*(?:dia|round|ronda)\s*(\d+)\s*$/i);
  return m ? parseInt(m[1]) : null;
}

function mergeTournamentRounds(rounds) {
  const sorted = [...rounds].sort((a, b) => {
    const ra = detectRoundNumber(a.name) ?? 99;
    const rb = detectRoundNumber(b.name) ?? 99;
    return ra !== rb ? ra - rb : (a.date||"").localeCompare(b.date||"");
  });
  const nRounds = sorted.length;
  const byKey = new Map();
  sorted.forEach((t, ri) => {
    for (const p of t.players) {
      const key = p.fed || ("name:" + formatPlayerName(p.name).toLowerCase().trim());
      const rs = {
        round: ri + 1, gross: p.r1?.gross ?? 0,
        scores: p.r1?.scores||[], pars: p.r1?.par||[], si: p.r1?.si||[],
        cr: p.r1?.cr, slope: p.r1?.slope, parTotal: p.r1?.parTotal||72,
        teeColor: p.teeColor, teeBorder: p.teeBorder, teeName: p.teeName,
      };
      if (byKey.has(key)) byKey.get(key).rsArr.push(rs);
      else byKey.set(key, { player: p, rsArr: [rs] });
    }
  });
  const refParTotal = sorted[0].players[0]?.r1?.parTotal || 72;
  const players = [];
  for (const { player, rsArr } of byKey.values()) {
    const g1 = rsArr[0]?.gross || 0;
    const g2 = rsArr[1]?.gross ?? null;
    const totalGross = rsArr.reduce((s,r) => s + r.gross, 0);
    const name = formatPlayerName(player.name);
    players.push({
      ...player, name,
      r1: rsArr[0] ? { gross: rsArr[0].gross, tp: rsArr[0].gross - rsArr[0].parTotal,
        scores: rsArr[0].scores, par: rsArr[0].pars, si: rsArr[0].si,
        sd: null, parTotal: rsArr[0].parTotal, cr: rsArr[0].cr, slope: rsArr[0].slope } : null,
      r2: rsArr[1] ? { gross: rsArr[1].gross, tp: rsArr[1].gross - rsArr[1].parTotal,
        scores: rsArr[1].scores, par: rsArr[1].pars, si: rsArr[1].si,
        sd: null, parTotal: rsArr[1].parTotal, cr: rsArr[1].cr, slope: rsArr[1].slope } : null,
      _totalGross: totalGross,
    });
  }
  const baseName = extractBaseName(sorted[0].name);
  const tcodeList = sorted.map(t => t.tcode).join("+");
  return {
    ...sorted[0], name: baseName, date: sorted[sorted.length-1].date,
    rounds: nRounds, playerCount: players.length, players, tcode: tcodeList,
    _isSynthetic: true,
  };
}

function buildDisplayList(tournaments) {
  const candidates = new Map();
  for (const t of tournaments) {
    if (detectRoundNumber(t.name) == null) continue;
    const base = extractBaseName(t.name);
    const key = `${t.ccode||"?"}_${base.toLowerCase().trim()}`;
    if (!candidates.has(key)) candidates.set(key, []);
    candidates.get(key).push(t);
  }
  const hiddenTcodes = new Set();
  const synthetics = [];
  for (const group of candidates.values()) {
    if (group.length < 2) continue;
    group.forEach(t => hiddenTcodes.add(t.tcode));
    synthetics.push(mergeTournamentRounds(group));
  }
  const standalone = tournaments.filter(t => !hiddenTcodes.has(t.tcode));
  return [...standalone, ...synthetics].sort((a,b) => (b.date||"").localeCompare(a.date||""));
}

const PILL_STYLE = {
  REGIONAL: {bg:"#263E78",color:"#FFD700"},
  NACIONAL: {bg:"#046A38",color:"#FFD700"},
  INTL:     {bg:"#00FF00",color:"#263E78"},
  PJA:      {bg:"#1e3a5f",color:"#fff"},
};
function TournPillBadge({tcode}){
  if(!tcode)return null;
  const pill = tcode.split("+").map(tc=>ALL_PILLS[tc]).find(Boolean);
  if(!pill)return null;
  const s=PILL_STYLE[pill]||{bg:"#888",color:"#fff"};
  const label=pill==="INTL"?"🌍 INTL":pill==="NACIONAL"?"🇵🇹 NACIONAL":pill;
  return <span style={{fontSize:9,fontWeight:800,borderRadius:3,padding:"1px 6px",
    background:s.bg,color:s.color,textTransform:"uppercase",letterSpacing:"0.04em",
    whiteSpace:"nowrap"}}>{label}</span>;
}

/* ── Normalizar players do JSON bruto ── */
function normalizeTorneioPlayers(torneios) {
  return torneios.map(t => ({
    ...t,
    players: t.players.map(p => ({
      ...p,
      name: formatPlayerName(p.name),
    }))
  }));
}

function assignPos(arr,fn){
  const s=[...arr].sort((a,b)=>(fn(a)||9999)-(fn(b)||9999));
  let pos=1;
  s.forEach((p,i)=>{if(i>0&&fn(p)!==fn(s[i-1]))pos=i+1;p._pos=pos;});
  return s;
}
const fmtTP=tp=>tp==null?"–":tp===0?"E":tp>0?`+${tp}`:`${tp}`;
const tpCol=tp=>tp==null?C.muted:tp<0?C.danger:tp===0?C.good:C.text2;
function scClass(sc,par){
  if(!sc||!par)return"";
  const d=sc-par;
  return d<=-2?"eagle":d===-1?"birdie":d===0?"par":d===1?"bogey":d===2?"double":"triple";
}
const SC={
  eagle: {bg:"#f59e0b",col:"#fff",r:"50%"},
  birdie:{bg:"#dc2626",col:"#fff",r:"50%"},
  par:   {bg:"transparent",col:C.text,r:0,brd:"none"},
  bogey: {bg:"#bfdbfe",col:"#1e3a8a",r:0,brd:"1px solid #93c5fd"},
  double:{bg:"#60a5fa",col:"#fff",r:0},
  triple:{bg:"#2563eb",col:"#fff",r:0},
  "":    {bg:"transparent",col:C.muted,r:0},
};
function ScScore({sc,par}){
  const s=SC[scClass(sc,par)]||SC[""];
  return <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",
    minWidth:26,minHeight:26,width:26,height:26,fontSize:13,fontWeight:700,
    background:s.bg,color:s.col,borderRadius:s.r,border:s.brd||"none",fontFamily:mono}}>{sc||""}</span>;
}

function EscPill({esc}){
  if(!esc)return<span style={{color:C.muted,fontSize:11}}>–</span>;
  const m={"Sub 10":["#1e40af","#dbeafe"],"Sub 12":["#1e40af","#dbeafe"],"Sub 14":["#166534","#dcfce7"],"Sub 16":["#166534","#dcfce7"]};
  const[tc,bg]=m[esc]||[C.text3,C.hover];
  return<span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:10,background:bg,color:tc,whiteSpace:"nowrap"}}>{esc}</span>;
}
function SexBadge({sex}){
  if(!sex)return null;
  return<span style={{fontSize:9,fontWeight:700,padding:"1px 4px",borderRadius:3,
    background:sex==="F"?"#fce7f3":"#dbeafe",color:sex==="F"?"#9d174d":"#1e40af",marginLeft:4}}>{sex}</span>;
}
function SDPill({sd,hcp}){
  if(sd==null)return<span style={{color:C.muted,fontFamily:mono,fontSize:11}}>–</span>;
  const d=sd-hcp;
  const[bg,col]=d>5?["#fee2e2","#dc2626"]:d>2?["#fef3c7","#d97706"]:d>0?["#fef9c3","#92400e"]:d>-3?["#dcfce7","#166534"]:["#bbf7d0","#15803d"];
  return<span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,background:bg,color:col,fontFamily:mono}}>{sd.toFixed(1)}</span>;
}

/* ──────────────────────────────────────────
   LEADERBOARD ACUMULADO
   Ordem: # | Jogador | ESC | FED | Clube | HCP | [TEE] | ±Par | Total | R1/± | R2/± | SD R1 | SD R2 | 🐦 | Par | ■
   ────────────────────────────────────────── */
function Leaderboard({players,nRounds,showTee}){
  const sorted=assignPos(players,p=>nRounds===1?p.r1.gross:(p.r2?p.r1.gross+p.r2.gross:9999));
  return(
    <div style={{overflowX:"auto"}}>
      <table style={{borderCollapse:"collapse",fontFamily:sans}}>
        <thead>
          <tr style={{borderBottom:bM}}>
            <th style={{...hs,width:28,textAlign:"center"}}>#</th>
            <th style={{...hs,textAlign:"left",paddingLeft:8,minWidth:165}}>Jogador</th>
            <th style={{...hs,width:52,textAlign:"center"}}>ESC.</th>
            {/* FED sempre visível */}
            <th style={{...hs,width:50,textAlign:"center",fontSize:10,color:C.muted,fontWeight:400}}>FED</th>
            <th style={{...hs,width:72,textAlign:"left"}}>Clube</th>
            <th style={{...hs,width:38,textAlign:"right"}}>HCP</th>
            {showTee&&<th style={{...hs,width:28,textAlign:"center"}}>TEE</th>}
            {/* ± antes de Total */}
            <th style={{...hs,width:40,textAlign:"right",borderLeft:bM}}>±Par</th>
            <th style={{...hs,width:46,textAlign:"right",fontWeight:800,color:C.text,borderLeft:bS}}>{nRounds===1?"Tot":"Total"}</th>
            {nRounds>=2&&<>
              <th style={{...hs,width:36,textAlign:"right",borderLeft:bM,background:"#dde8d9"}}>R1</th>
              <th style={{...hs,width:30,textAlign:"right",background:"#dde8d9"}}>±</th>
              <th style={{...hs,width:46,textAlign:"center",background:"#f0f5ee"}}>SD</th>
              <th style={{...hs,width:22,textAlign:"center",background:"#f0f5ee",fontSize:10}}>🐦</th>
              <th style={{...hs,width:22,textAlign:"center",background:"#f0f5ee",fontSize:10}}>=</th>
              <th style={{...hs,width:22,textAlign:"center",background:"#f0f5ee",fontSize:10}}>■</th>
              <th style={{...hs,width:36,textAlign:"right",borderLeft:bM,background:"#dde8d9"}}>R2</th>
              <th style={{...hs,width:30,textAlign:"right",background:"#dde8d9"}}>±</th>
              <th style={{...hs,width:46,textAlign:"center",background:"#f0f5ee"}}>SD</th>
              <th style={{...hs,width:22,textAlign:"center",background:"#f0f5ee",fontSize:10}}>🐦</th>
              <th style={{...hs,width:22,textAlign:"center",background:"#f0f5ee",fontSize:10}}>=</th>
              <th style={{...hs,width:22,textAlign:"center",background:"#f0f5ee",fontSize:10}}>■</th>
            </>}
            {nRounds===1&&<>
              <th style={{...hs,width:48,textAlign:"center",borderLeft:bM}}>SD</th>
              <th style={{...hs,width:28,textAlign:"center"}}>🐦</th>
              <th style={{...hs,width:28,textAlign:"center"}}>Par</th>
              <th style={{...hs,width:28,textAlign:"center"}}>■</th>
            </>}

          </tr>
        </thead>
        <tbody>
          {sorted.map((p,idx)=>{
            const prev=sorted[idx-1];
            const showPos=idx===0||p._pos!==prev?._pos;
            const medal=p._pos===1?"🥇":p._pos===2?"🥈":p._pos===3?"🥉":null;
            const isInc=nRounds===2&&!p.r2;
            const sbg=p.manuel?C.manuelGreen:isInc?C.hover:C.card;
            const g1=p.r1.gross,tp1=p.r1.tp;
            const g2=p.r2?.gross??null,tp2=p.r2?.tp??null;
            const tot=nRounds===1?g1:g2!=null?g1+g2:null;
            const totTp=tot!=null?tot-PAR_TOT*nRounds:null;
            const calcStats=rd=>{let b=0,pa=0,bo=0;if(rd)rd.scores.forEach((s,i)=>{const d=s-PAR[i];if(d<=-1)b++;else if(d===0)pa++;else bo++;});return{b,pa,bo};};
            const st1=calcStats(p.r1),st2=calcStats(p.r2);
            return(
              <tr key={idx} style={{background:p.manuel?C.manuelGreen:isInc?C.hover:undefined,opacity:isInc?.75:1,borderBottom:bS}}>
                <td style={{...cs,textAlign:"center",fontWeight:800,fontSize:11,color:C.text3}}>
                  {isInc?<span style={{fontSize:9,color:"#dc2626",fontStyle:"italic"}}>WD</span>:showPos?(medal||p._pos):""}
                </td>
                <td style={{...cs,paddingLeft:8,background:sbg,boxShadow:"2px 0 5px rgba(0,0,0,.04)"}}>
                  <span style={{fontWeight:p.manuel?700:500,color:p.manuel?C.accent:C.text}}>{p.name}</span>
                  <SexBadge sex={p.sex}/>
                  {p.manuel&&<span style={{marginLeft:4}}>⭐</span>}
                </td>
                <td style={{...cs,textAlign:"center"}}><EscPill esc={p.esc}/></td>
                {/* FED sempre */}
                <td style={{...cs,textAlign:"center",fontSize:10,color:C.muted,fontFamily:mono}}>{p.fed||"–"}</td>
                <td style={{...cs,color:C.text3,fontSize:11,maxWidth:80,overflow:"hidden",textOverflow:"ellipsis"}}>{p.club}</td>
                <td style={{...cs,textAlign:"right",fontFamily:mono,fontSize:11,color:C.text3}}>{p.hcp.toFixed(1)}</td>
                {showTee&&<td style={{...cs,textAlign:"center"}}><TeeDot color={p.teeColor} border={p.teeBorder}/></td>}
                {/* ±Par antes de Total */}
                <td style={{...cs,textAlign:"right",fontFamily:mono,fontWeight:700,borderLeft:bM,fontSize:13,color:tpCol(totTp)}}>{fmtTP(totTp)}</td>
                <td style={{...cs,textAlign:"right",fontFamily:mono,fontSize:14,fontWeight:800,borderLeft:bS,color:tot==null?C.muted:C.text}}>{tot||"–"}</td>
                {nRounds>=2&&<>
                  <td style={{...cs,textAlign:"right",fontFamily:mono,fontWeight:600,borderLeft:bM,background:"#e8f2e4"}}>{g1}</td>
                  <td style={{...cs,textAlign:"right",fontFamily:mono,fontSize:11,background:"#e8f2e4",color:tpCol(tp1)}}>{fmtTP(tp1)}</td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3"}}><SDPill sd={p.r1.sd} hcp={p.hcp}/></td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3",color:C.good,fontWeight:700,fontSize:11}}>{st1.b||"–"}</td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3",color:C.text3,fontSize:11}}>{st1.pa||"–"}</td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3",color:C.danger,fontSize:11}}>{st1.bo||"–"}</td>
                  <td style={{...cs,textAlign:"right",fontFamily:mono,fontWeight:600,borderLeft:bM,background:"#e8f2e4",color:g2==null?C.muted:C.text}}>{g2||"–"}</td>
                  <td style={{...cs,textAlign:"right",fontFamily:mono,fontSize:11,background:"#e8f2e4",color:tpCol(tp2)}}>{fmtTP(tp2)}</td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3"}}><SDPill sd={p.r2?.sd||null} hcp={p.hcp}/></td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3",color:C.good,fontWeight:700,fontSize:11}}>{p.r2?st2.b||"–":"–"}</td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3",color:C.text3,fontSize:11}}>{p.r2?st2.pa||"–":"–"}</td>
                  <td style={{...cs,textAlign:"center",background:"#f5f9f3",color:C.danger,fontSize:11}}>{p.r2?st2.bo||"–":"–"}</td>
                </>}
                {nRounds===1&&<>
                  <td style={{...cs,textAlign:"center",borderLeft:bM}}><SDPill sd={p.r1.sd} hcp={p.hcp}/></td>
                  <td style={{...cs,textAlign:"center",color:C.good,fontWeight:700}}>{st1.b||"–"}</td>
                  <td style={{...cs,textAlign:"center",color:C.text3}}>{st1.pa||"–"}</td>
                  <td style={{...cs,textAlign:"center",color:C.danger}}>{st1.bo||"–"}</td>
                </>}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ── PAINEL COM TABS ── */
function TournPanel({title,subtitle,players,nRounds,showTee}){
  const tabs=nRounds===1
    ?[{id:"sc",label:`Scorecard (${players.length} jog)`}]
    :[{id:"r1",label:`R1 (${players.filter(p=>p.r1).length} jog)`},
      {id:"r2",label:`R2 (${players.filter(p=>p.r2).length} jog)`},
      {id:"total",label:`Total (${players.length} jog)`}];
  const[tab,setTab]=useState(nRounds===1?"sc":"total");
  const tabBtn=id=>({
    padding:"5px 14px",borderRadius:"6px 6px 0 0",border:bM,borderBottom:"none",
    background:tab===id?C.card:C.hover,color:tab===id?C.text:C.text3,
    fontWeight:tab===id?700:400,fontSize:12,cursor:"pointer",marginRight:2,
    position:"relative",bottom:-1,
  });
  return(
    <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:16}}>
      <div style={{marginBottom:10}}>
        <div style={{fontSize:15,fontWeight:800,color:C.text,marginBottom:3}}>{title}</div>
        <div style={{fontSize:11,color:C.muted}}>{subtitle}</div>
      </div>
      <div style={{borderBottom:bM,marginBottom:12,display:"flex"}}>
        {tabs.map(t=><button key={t.id} style={tabBtn(t.id)} onClick={()=>setTab(t.id)}>{t.label}</button>)}
      </div>
      {tab==="sc"&&<Scorecard players={players} roundKey="r1" showTee={showTee}/>}
      {tab==="r1"&&<Scorecard players={players} roundKey="r1" showTee={showTee}/>}
      {tab==="r2"&&<Scorecard players={players.filter(p=>p.r2)} roundKey="r2" showTee={showTee}/>}
      {tab==="total"&&<Leaderboard players={players} nRounds={nRounds} showTee={showTee}/>}
    </div>
  );
}

/* ── APP ── */
function App(){
  const[selected,setSelected]=useState(0);
  const[sidebarOpen,setSidebarOpen]=useState(true);
  const[search,setSearch]=useState("");

  // Normalize names + build display list (merge Dia1/Dia2 etc)
  const [displayList] = useState(()=>buildDisplayList(normalizeTorneioPlayers(TORNEIOS_JSON)));

  // Group by YYYY-MM, sorted reverse (newest first) — identical to real page
  const groups={};
  displayList.forEach((t,i)=>{
    const key=t.date?t.date.substring(0,7):"?";
    if(!groups[key])groups[key]=[];
    groups[key].push({...t,_idx:i});
  });
  const groupKeys=Object.keys(groups).sort().reverse();

  function groupLabel(key){
    if(key==="?")return"Data desconhecida";
    const[yr,mo]=key.split("-");
    const months=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    return`${months[parseInt(mo)-1]||mo} ${yr}`;
  }

  const cur=displayList[selected];
  if(!cur)return<div>Sem dados</div>;

  const nRounds=Math.min(cur.rounds||1,2);
  const players=cur.players||[];
  const refP=players[0];
  const nh=refP?.r1?.par?.length||18;
  const parTotal=refP?.r1?.parTotal||0;

  const tabList=nRounds===1
    ?[{id:"sc",label:`Scorecard (${players.length} jog)`}]
    :[{id:"r1",label:`R1 (${players.filter(p=>p.r1).length} jog)`},
      {id:"r2",label:`R2 (${players.filter(p=>p.r2).length} jog)`},
      {id:"total",label:`Total (${players.length} jog)`}];

  const[tab,setTab]=useState("sc");
  const[lastTcode,setLastTcode]=useState(cur.tcode);
  if(cur.tcode!==lastTcode){
    setLastTcode(cur.tcode);
    setTab(nRounds===1?"sc":"total");
  }
  const activeTab=tabList.find(t=>t.id===tab)?tab:(nRounds===1?"sc":"total");

  const tabBtn=id=>({
    padding:"5px 14px",borderRadius:"6px 6px 0 0",border:bM,borderBottom:"none",
    background:activeTab===id?C.card:C.hover,color:activeTab===id?C.text:C.text3,
    fontWeight:activeTab===id?700:400,fontSize:12,cursor:"pointer",marginRight:2,
    position:"relative",bottom:-1,fontFamily:sans,
  });

  // Sidebar filter
  const sq=search.toLowerCase();
  const matchT=t=>!sq||t.name.toLowerCase().includes(sq)||t.campo.toLowerCase().includes(sq)||(t.escalao||"").toLowerCase().includes(sq);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",fontFamily:sans}}>
      {/* Topbar */}
      <div style={{background:C.topbar,padding:"9px 16px",display:"flex",alignItems:"center",gap:14,flexShrink:0}}>
        <span style={{color:"#e8eddf",fontWeight:800,fontSize:14}}>⛳ Golf</span>
        {["Jogadores","Simulador","Calendário","DRIVE","USKids","Riv Intl","Comparar","Campos","BJGT","Diversos"].map(p=>(
          <span key={p} style={{color:"rgba(232,237,223,.5)",fontSize:12}}>{p}</span>
        ))}
      </div>

      {/* Toolbar */}
      <div style={{background:C.card,borderBottom:bM,padding:"7px 14px",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <button onClick={()=>setSidebarOpen(v=>!v)} style={{
          padding:"3px 8px",border:bM,borderRadius:4,background:C.hover,
          cursor:"pointer",fontSize:12,color:C.text2,
        }}>{sidebarOpen?"◀":"▶"}</button>
        <span style={{fontSize:13,fontWeight:800,color:C.text}}>🏌️ Torneios</span>
        <span style={{marginLeft:"auto",fontSize:11,color:C.muted}}>{displayList.length} torneios ({TORNEIOS_JSON.length} originais)</span>
      </div>

      {/* Body */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        {/* SIDEBAR — agrupado por mês/ano, mais recente primeiro */}
        {sidebarOpen&&<div style={{width:248,flexShrink:0,background:C.card,borderRight:bM,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{padding:"7px 10px",borderBottom:bM,flexShrink:0}}>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Pesquisar..."
              style={{width:"100%",padding:"4px 8px",border:bS,borderRadius:4,
                fontSize:12,fontFamily:sans,background:C.bg,color:C.text,outline:"none"}}
            />
          </div>
          <div style={{overflowY:"auto",flex:1}}>
            {groupKeys.map(gk=>{
              const ts=groups[gk].filter(t=>matchT(t));
              if(!ts.length)return null;
              return(
                <div key={gk}>
                  {/* Section header — dark, identical to real page */}
                  <div style={{
                    padding:"5px 12px",fontSize:10,fontWeight:700,
                    textTransform:"uppercase",letterSpacing:"0.05em",
                    background:"#2a3a22",color:"#b8cba8",
                  }}>{groupLabel(gk)}</div>
                  {ts.map(t=>{
                    const i=t._idx;
                    const isActive=i===selected;
                    const nR=t.rounds||1;
                    const tNh=t.players[0]?.r1?.par?.length||18;
                    return(
                      <button key={t.tcode+"_"+t.date} onClick={()=>setSelected(i)} style={{
                        width:"100%",textAlign:"left",padding:"8px 12px",border:"none",
                        background:isActive?C.accentLight:"transparent",
                        color:isActive?C.accent:C.text2,
                        borderBottom:bS,
                        borderLeft:isActive?`3px solid ${C.accent}`:"3px solid transparent",
                        cursor:"pointer",display:"block",
                      }}>
                        {/* Name + badges */}
                        <div style={{display:"flex",alignItems:"baseline",gap:4,flexWrap:"wrap",marginBottom:2}}>
                          <span style={{fontSize:12,fontWeight:isActive?700:500,lineHeight:1.3,flex:1}}>{t.name}</span>
                          <div style={{display:"flex",gap:2,flexShrink:0}}>
                            {t.ccode&&<span style={{fontFamily:mono,fontSize:9,fontWeight:600,background:"rgba(0,0,0,.08)",color:C.muted,borderRadius:3,padding:"0 4px"}}>{t.ccode}</span>}
                            {t.tcode&&<span style={{fontFamily:mono,fontSize:9,fontWeight:700,background:isActive?C.accent:"#2563eb",color:"#fff",borderRadius:3,padding:"0 4px",opacity:isActive?1:0.7}}>{t.tcode}</span>}
                            {t.ccode&&t.tcode&&<span onClick={e=>{e.stopPropagation();window.open(`https://scoring.datagolf.pt/pt/Classifications.aspx?ccode=${t.ccode}&tcode=${t.tcode}`,"_blank");}} style={{fontSize:9,fontWeight:600,cursor:"pointer",color:"#2563eb",border:"1px solid #2563eb",borderRadius:3,padding:"0 4px",lineHeight:1.6}}>↗</span>}
                          </div>
                        </div>
                        {/* Meta */}
                        <div style={{fontSize:10,color:C.muted,display:"flex",gap:4,flexWrap:"wrap"}}>
                          {t.campo&&<span>{t.campo}</span>}
                          <span style={{marginLeft:t.campo?2:0}}>· {t.playerCount} jog · {nR}R · {tNh}h</span>
                        </div>
                        <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:3,alignItems:"center"}}>
                          {t.escalao&&<EscPill esc={t.escalao}/>}
                          <TournPillBadge tcode={t.tcode}/>
                        </div>
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>}

        {/* DETAIL PANEL */}
        <div style={{flex:1,overflow:"auto",padding:14}}>
          {/* Header */}
          <div style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"baseline",flexWrap:"wrap",gap:8,marginBottom:4}}>
              <div style={{fontSize:16,fontWeight:800,color:C.text}}>{cur.name}</div>
              <div style={{display:"flex",gap:3}}>
                {cur.ccode&&<span style={{fontFamily:mono,fontSize:10,fontWeight:600,background:C.hover,color:C.muted,border:bS,borderRadius:4,padding:"1px 6px"}}>{cur.ccode}</span>}
                {cur.tcode&&<span style={{fontFamily:mono,fontSize:10,fontWeight:700,background:"#2563eb",color:"#fff",borderRadius:4,padding:"1px 6px"}}>{cur.tcode}</span>}
                {cur.ccode&&cur.tcode&&<a href={`https://scoring.datagolf.pt/pt/Classifications.aspx?ccode=${cur.ccode}&tcode=${cur.tcode}`} target="_blank" rel="noopener noreferrer" style={{fontSize:10,fontWeight:600,color:"#2563eb",border:"1px solid #2563eb",borderRadius:4,padding:"1px 6px",textDecoration:"none"}}>Link Federação ↗</a>}
              </div>
            </div>
            <div style={{fontSize:11,color:C.muted,display:"flex",gap:8,flexWrap:"wrap"}}>
              {cur.campo&&<span>📍 {cur.campo}</span>}
              <span>{cur.date?.slice(0,10)}</span>
              <span style={{background:C.hover,border:bS,borderRadius:4,padding:"1px 7px",fontSize:11,color:C.text2}}>
                {players.length} jog · {nRounds}R · {nh}h · Par {parTotal}
                {refP?.r1?.cr&&` · CR ${refP.r1.cr}`}
                {refP?.r1?.slope&&` · Slope ${refP.r1.slope}`}
              </span>
              {cur.escalao&&<EscPill esc={cur.escalao}/>}
              {cur.circuit&&<span style={{textTransform:"uppercase",fontWeight:700,fontSize:10,color:C.accent,border:`1px solid ${C.accent}`,borderRadius:4,padding:"1px 7px"}}>{cur.circuit}</span>}
            </div>
          </div>

          {/* Tabs */}
          <div style={{borderBottom:bM,marginBottom:12,display:"flex"}}>
            {tabList.map(t=><button key={t.id} style={tabBtn(t.id)} onClick={()=>setTab(t.id)}>{t.label}</button>)}
          </div>

          {/* Table */}
          {activeTab==="sc"&&<Scorecard players={players} roundKey="r1" showTee={true}/>}
          {activeTab==="r1"&&<Scorecard players={players} roundKey="r1" showTee={true}/>}
          {activeTab==="r2"&&<Scorecard players={players.filter(p=>p.r2)} roundKey="r2" showTee={true}/>}
          {activeTab==="total"&&<Leaderboard players={players} nRounds={nRounds} showTee={true}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
